hm-BYAR! SOH-loh neh-seh-SEE-toh BWEH-nah seh-NYAHL deh WEE-fee..."}]},{partnerSpanish:"La 204 está justo al lado del router principal, así que vuela el internet. Aquí tienes tu llave nueva. ¿Puedo ayudarte con algo más?",partnerEnglish:"204 is right beside the main router, so the internet flies. Here’s your new key. Can I help with anything else?",partnerPhonetic:"lah dohs-SYEHN-tohs KWAH-troh ehs-TAH HOOS-toh ahl LAH-doh dehl router...",coachNoteEnglish:"Thank Mateo and ask what time breakfast is served!",suggestedReplies:[{spanish:"¡Muchísimas gracias! Solo una duda más: ¿a qué hora sirven el desayuno mañana?",english:"Thank you so much! Just one quick question: what time do you serve breakfast tomorrow?",phonetic:"moo-CHEE-see-mahs GRAH-syahs! ah keh OH-rah SEER-vehn ehl deh-sah-YOO-noh mah-NYAH-nah?"}]}]},{id:"rp-int-pharmacy",title:"Neighborhood Pharmacy Visit",setting:"Farmacia Central Counter",location:"Madrid, Spain",level:"intermediate",partnerId:"sofia",partnerRoleInScenario:"Licensed Pharmacist",englishSituationBrief:"You woke up with a sore throat and mild headache during your trip. In Spanish-speaking countries, pharmacists give direct helpful advice for minor ailments—explain your symptoms, ask about dosage, and mention allergies.",culturalTip:'In Spain and Latin America, "la farmacia" (marked with a glowing green cross) is your first stop for colds, allergies, or minor aches without needing a clinic appointment!',keySurvivalPhrases:[{spanish:"Me duele la garganta desde ayer.",english:"My throat has hurt since yesterday.",phonetic:"meh DWEH-leh lah gar-GAHN-tah DEHS-deh ah-YEHR"},{spanish:"¿Cada cuántas horas debo tomarlo?",english:"Every how many hours should I take it?",phonetic:"KAH-dah KWAHN-tahs OH-rahs DEH-boh toh-MAR-loh"}],objectives:[{id:"ph-1",labelEnglish:"Describe your symptoms (throat / head / cold)",hintSpanish:"Buenas tardes, me duele bastante la garganta y un poco la cabeza.",hintPhonetic:"meh DWEH-leh bahs-TAHN-teh lah gar-GAHN-tah...",keywords:["duele","dolor","garganta","cabeza","tos","fiebre","resfriado"]},{id:"ph-2",labelEnglish:"Mention whether you have medicine allergies",hintSpanish:"No soy alérgico a ningún medicamento.",hintPhonetic:"noh soy ah-LEHR-hee-koh ah neen-GOON meh-dee-kah-MEHN-toh",keywords:["alérgic","alergic","ningún","ninguna","penicilina","medicamento"]},{id:"ph-3",labelEnglish:"Ask how often / with food to take the remedy",hintSpanish:"¿Cada cuántas horas debo tomar las pastillas?",hintPhonetic:"KAH-dah KWAHN-tahs OH-rahs DEH-boh toh-MAR lahs pahs-TEE-yahs?",keywords:["horas","cada","tomar","comida","cuándo","cuando","pastillas"]}],steps:[{partnerSpanish:"¡Buenas! Dime, ¿qué síntomas tienes y en qué te puedo ayudar hoy?",partnerEnglish:"Hello! Tell me, what symptoms are you having and how can I help today?",partnerPhonetic:"BWEH-nahs! DEE-meh, keh SEEN-toh-mahs TYEH-nehs?",coachNoteEnglish:'Use "Me duele + body part" (e.g., "Me duele la garganta y la cabeza").',suggestedReplies:[{spanish:"Buenas tardes. Desde anoche me duele bastante la garganta y tengo un poco de dolor de cabeza.",english:"Good afternoon. Since last night my throat hurts quite a bit and I have a mild headache.",phonetic:"BWEH-nahs TAR-dehs. DEHS-deh ah-NOH-cheh meh DWEH-leh lah gar-GAHN-tah..."}]},{partnerSpanish:"Entiendo, con el cambio de clima hay muchos resfriados. ¿Tienes fiebre o eres alérgico a algún medicamento?",partnerEnglish:"Got it, lots of colds going around with the weather change. Do you have a fever, or are you allergic to any medication?",partnerPhonetic:"ehn-TYEHN-doh... TYEH-nehs FYEH-breh oh EH-rehs ah-LEHR-hee-koh?",coachNoteEnglish:'Confirm whether you have allergies ("No soy alérgico/a a ningún medicamento").',suggestedReplies:[{spanish:"No tengo fiebre y no soy alérgico a ningún medicamento.",english:"I don’t have a fever and I’m not allergic to any medication.",phonetic:"noh TEHN-goh FYEH-breh ee noh soy ah-LEHR-hee-koh..."}]},{partnerSpanish:"Perfecto. Te doy estas pastillas suaves para la garganta y un analgésico ligero. ¿Tienes alguna duda sobre cómo tomarlos?",partnerEnglish:"Perfect. I’m giving you soothing throat lozenges and a mild pain reliever. Any question about how to take them?",partnerPhonetic:"pehr-FEHK-toh. teh doy EHS-tahs pahs-TEE-yahs...",coachNoteEnglish:"Ask how many hours apart you should take them!",suggestedReplies:[{spanish:"Sí, ¿cada cuántas horas debo tomarlos y es mejor después de comer?",english:"Yes, every how many hours should I take them, and is it better after eating?",phonetic:"see, KAH-dah KWAHN-tahs OH-rahs DEH-boh toh-MAR-lohs?"}]}]},{id:"rp-int-dinner",title:"Coordinating Dinner Plans with Friends",setting:"Group Plans Before Friday Night",location:"Buenos Aires, Argentina",level:"intermediate",partnerId:"valentina",partnerRoleInScenario:"Local Friend",englishSituationBrief:"Valentina wants to grab dinner tonight at 10:00 PM at a steakhouse—but you have an early morning tomorrow and prefer somewhere vegetarian-friendly slightly earlier!",culturalTip:"Argentines routinely eat dinner at 9:30–10:30 PM, so proposing 8:00 or 8:30 PM politely is super relatable!",keySurvivalPhrases:[{spanish:"¿Te importaría si quedamos un poco más temprano?",english:"Would you mind if we meet a bit earlier?",phonetic:"teh eem-por-tah-REE-ah see keh-DAH-mohs oon POH-koh mahs tehm-PRAH-noh"}],objectives:[{id:"dn-1",labelEnglish:"Accept the hangout enthusiastically",hintSpanish:"¡Me encantaría vernos esta noche!",hintPhonetic:"meh ehn-kahn-tah-REE-ah VEHR-nohs EHS-tah NOH-cheh!",keywords:["encantaría","encantaria","claro","genial","buenísimo","vernos"]},{id:"dn-2",labelEnglish:"Suggest an earlier time (like 8:00 or 8:30 PM)",hintSpanish:"¿Podemos vernos a las ocho y media? Mañana madrugo.",hintPhonetic:"poh-DEH-mohs VEHR-nohs ah lahs OH-choh ee MEH-dyah?",keywords:["ocho","temprano","madrugo","mañana","8"]},{id:"dn-3",labelEnglish:"Suggest a spot with vegetarian / varied options",hintSpanish:"¿Conoces algún lugar con opciones vegetarianas o pasta?",hintPhonetic:"koh-NOH-sehs ahl-GOON loo-GAR kohn ohp-SYOH-nehs veh-heh-tah-RYAH-nahs?",keywords:["vegetarian","pasta","verduras","opciones","italiano","menú"]}],steps:[{partnerSpanish:"¡Hola! ¿Cenamos juntos esta noche? Pensaba reservar en una parrilla buenísima en Palermo a las diez de la noche.",partnerEnglish:"Hey! Want to grab dinner tonight? I was thinking of booking an awesome steakhouse in Palermo at 10:00 PM.",partnerPhonetic:"OH-lah! seh-NAH-mohs HOON-tohs EHS-tah NOH-cheh?",coachNoteEnglish:"Say you’d love to see her, AND politely propose meeting earlier around 8:00 / 8:30!",suggestedReplies:[{spanish:"¡Me encantaría vernos! Solo que mañana madrugo, ¿te parece bien si vamos a las ocho y media?",english:"I’d love to see each other! Just that I wake up early tomorrow—would 8:30 work for you?",phonetic:"meh ehn-kahn-tah-REE-ah VEHR-nohs! SOH-loh keh mah-NYAH-nah mah-DROO-goh..."}]},{partnerSpanish:"¡Dale, ocho y media me viene bárbaro! ¿Te parece bien la parrilla o preferís otro tipo de comida?",partnerEnglish:"Sounds good, 8:30 works great for me! Does the steakhouse work for you, or do you prefer another type of food?",partnerPhonetic:"DAH-leh, OH-choh ee MEH-dyah meh VYEH-neh BAR-bah-roh!",coachNoteEnglish:"Ask for a restaurant with great vegetarian options or homemade pasta!",suggestedReplies:[{spanish:"En realidad prefiero un lugar con buenas opciones vegetarianas o pasta fresca, ¿conoces alguno cerca?",english:"Actually I prefer a spot with great vegetarian options or fresh pasta—do you know one nearby?",phonetic:"ehn reh-ah-lee-DAHD preh-FYEH-roh oon loo-GAR kohn BWEH-nahs ohp-SYOH-nehs..."}]},{partnerSpanish:"¡Obvio! Hay una trattoria hermosa en la esquina con pastas caseras increíbles. ¡Reservado para las 20:30, nos vemos ahí!",partnerEnglish:"Totally! There’s a gorgeous trattoria on the corner with incredible homemade pasta. Booked for 8:30—see you there!",partnerPhonetic:"OHB-vyoh! ai OO-nah trah-toh-REE-ah ehr-MOH-sah... nohs VEH-mohs ah-EE!",coachNoteEnglish:"Confirm warmly to complete the plan!",suggestedReplies:[{spanish:"¡Qué planazo! Muchas gracias por reservar, ¡nos vemos a las ocho y media!",english:"What an awesome plan! Thanks for booking—see you at 8:30!",phonetic:"keh plah-NAH-soh! nohs VEH-mohs ah lahs OH-choh ee MEH-dyah!"}]}]},{id:"rp-chal-return",title:"Returning a Faulty Charger Without a Paper Receipt",setting:"Electronics Shop Service Counter",location:"Mexico City, Mexico",level:"challenging",partnerId:"mateo",partnerRoleInScenario:"Store Shift Manager",englishSituationBrief:"Yesterday you bought a travel laptop adapter, and it sparked and stopped charging last night. You threw away the paper receipt, though you have the bank card charge on your phone! Persuade Mateo politely to approve an instant exchange.",culturalTip:'Staying friendly while using conditional verbs ("¿Habría alguna manera de...?", "Le agradecería muchísimo...") turns store policies into helpful exceptions!',keySurvivalPhrases:[{spanish:"Dejó de funcionar anoche en cuanto lo conecté.",english:"It stopped working last night as soon as I plugged it in.",phonetic:"deh-HOH deh foon-syoh-NAR ah-NOH-cheh ehn KWAHN-toh loh koh-nehk-TEH"},{spanish:"Aunque no conservo el ticket impreso, tengo el comprobante bancario en el móvil.",english:"Even though I didn’t keep the printed slip, I have the bank proof on my phone.",phonetic:"AWN-keh noh kohn-SEHR-voh ehl TEE-keht..."}],objectives:[{id:"ret-1",labelEnglish:"Explain clearly when you bought it & how it failed",hintSpanish:"Compré este adaptador ayer por la tarde, pero dejó de funcionar anoche.",hintPhonetic:"kohm-PREH EHS-teh ah-dahp-tah-DOR ah-YEHR, PEH-roh deh-HOH deh foon-syoh-NAR.",keywords:["compré","compre","ayer","dejó","funcionar","falla","cargador","adaptador"]},{id:"ret-2",labelEnglish:"Offer digital bank proof in place of the paper receipt",hintSpanish:"Se me perdió el ticket en papel, pero aquí tengo el cargo bancario con la hora exacta.",hintPhonetic:"seh meh pehr-DYOH ehl TEE-keht, PEH-roh TEHN-goh ehl KAR-goh...",keywords:["ticket","recibo","comprobante","banco","bancario","tarjeta","móvil","celular"]},{id:"ret-3",labelEnglish:"Propose exchanging for a working unit rather than cash refund",hintSpanish:"No necesito reembolso; me bastaría con que me lo cambiaran por otro igual.",hintPhonetic:"meh bahs-tah-REE-ah kohn keh meh loh kahm-BYAH-rahn por OH-troh...",keywords:["cambiar","cambio","otro","reemplazo","mismo","reembolso"]}],steps:[{partnerSpanish:"Buenas tardes, soy el encargado de turno. Me comenta mi compañero que tuviste un inconveniente con un accesorio, ¿qué pasó exactamente?",partnerEnglish:"Good afternoon, I’m the manager on duty. My colleague mentioned you had an issue with an accessory—what happened exactly?",partnerPhonetic:"BWEH-nahs TAR-dehs, soy ehl ehn-kar-GAH-doh deh TOOR-noh...",coachNoteEnglish:"Use past tenses cleanly to state when you purchased it and what went wrong!",suggestedReplies:[{spanish:"Buenas tardes. Compré este cargador ayer mismo aquí, pero en cuanto lo conecté anoche dejó de funcionar por completo.",english:"Good afternoon. I bought this charger right here yesterday, and as soon as I plugged it in last night it stopped working completely.",phonetic:"BWEH-nahs TAR-dehs. kohm-PREH EHS-teh kar-gah-DOR ah-YEHR MEES-moh..."}]},{partnerSpanish:"Vaya, qué raro en ese modelo. Por política de la tienda necesitamos el ticket impreso para procesar devoluciones. ¿Lo traes contigo?",partnerEnglish:"Hmm, unusual on that model. Store policy requires the printed receipt to process returns. Do you have it on you?",partnerPhonetic:"VAH-yah, keh RRAH-roh... neh-seh-see-TAH-mohs ehl TEE-keht eem-PREH-soh...",coachNoteEnglish:"Acknowledge the rule diplomatically and offer your digital bank statement + offer a direct exchange!",suggestedReplies:[{spanish:"Entiendo la política; lamentablemente tiré el ticket de papel sin darme cuenta, pero tengo el cargo bancario exacto en mi teléfono. Además, solo busco cambiarlo por otro que funcione.",english:"I understand the policy; unfortunately I tossed the paper receipt without realizing, though I have the exact bank charge on my phone. Plus, I’m only looking to swap it for a working unit.",phonetic:"ehn-TYEHN-doh lah poh-LEE-tee-kah... SOH-loh BOOS-koh kahm-BYAR-loh por OH-troh..."}]},{partnerSpanish:"Aprecio mucho tu amabilidad. Con la hora del cargo puedo localizar la factura en caja y autorizar el cambio directo ahora mismo. ¡Probemos el nuevo aquí mismo antes de que te vayas!",partnerEnglish:"I really appreciate how polite you are. Using the charge timestamp I can pull the invoice up and approve a direct swap right now. Let’s test the new one right here before you head out!",partnerPhonetic:"ah-PREH-syoh MOO-choh too ah-mah-bee-lee-DAHD... proh-BEH-mohs ehl NWEH-voh!",coachNoteEnglish:"Close with graceful gratitude—mission accomplished!",suggestedReplies:[{spanish:"Te lo agradezco muchísimo, de verdad me salvaste el día de trabajo. ¡Probémoslo!",english:"I appreciate that tremendously—you truly saved my workday. Let’s test it out!",phonetic:"teh loh ah-grah-DEHS-koh moo-CHEE-see-moh..."}]}]},{id:"rp-chal-interview",title:"Creative Project Interview in Barcelona",setting:"Video Call with Hiring Director",location:"Barcelona, Spain",level:"challenging",partnerId:"valentina",partnerRoleInScenario:"Creative Studio Director",englishSituationBrief:"You are interviewing for an international role collaborating with teams in Spain and Latin America. Highlight your strengths, explain how you handle tight deadlines, and ask an insightful question about team culture.",culturalTip:'Spanish interviewers appreciate warm, collaborative confidence ("disfruto trabajar en equipo") rather than overly stiff corporate buzzwords.',keySurvivalPhrases:[{spanish:"Me adapto rápido a entornos dinámicos.",english:"I adapt quickly to dynamic environments.",phonetic:"meh ah-DAHP-toh RRAH-pee-doh ah ehn-TOR-nohs dee-NAH-mee-kohs"}],objectives:[{id:"iv-1",labelEnglish:"Summarize your background & collaborative strength",hintSpanish:"Llevo varios años gestionando proyectos y disfruto mucho coordinar equipos.",hintPhonetic:"YEH-voh VAH-ryohs AH-nyohs hehs-tyoh-NAHN-doh proh-YEHK-tohs...",keywords:["experiencia","años","equipo","proyectos","adapto","trabajo","diseño","comunicación"]},{id:"iv-2",labelEnglish:"Explain calmly how you handle pressure / changing priorities",hintSpanish:"Cuando surge un imprevisto, priorizo lo urgente y mantengo al equipo al tanto.",hintPhonetic:"KWAHN-doh SOOR-heh oon eem-preh-VEES-toh, pryoh-REE-soh...",keywords:["priorizo","priorizar","calma","plazo","imprevisto","organizo","tanto","comunicar"]},{id:"iv-3",labelEnglish:"Ask a thoughtful question about the team’s day-to-day culture",hintSpanish:"¿Cómo describirías la cultura del equipo en el día a día?",hintPhonetic:"KOH-moh dehs-kree-bee-REE-ahs lah kool-TOO-rah dehl eh-KEE-poh?",keywords:["cultura","equipo","día a día","éxito","objetivos","colaboran"]}],steps:[{partnerSpanish:"¡Hola! Qué placer saludarte por fin.Revisé tu portafolio y me gustó mucho tu enfoque. Para romper el hielo, ¿cómo resumirías lo que más disfrutas aportar a un equipo?",partnerEnglish:"Hello! Lovely to finally meet you. I reviewed your portfolio and really liked your approach. To break the ice, how would you sum up what you most enjoy bringing to a team?",partnerPhonetic:"OH-lah! keh plah-SEHR sah-loo-DAR-teh por feen...",coachNoteEnglish:'"Llevo X años + gerund" is the sleekest native structure for "I have been doing X for Y years"!',suggestedReplies:[{spanish:"¡El placer es mío! Llevo varios años trabajando en proyectos creativos y lo que más disfruto es conectar ideas complejas de forma clara en equipo.",english:"The pleasure is mine! I’ve spent several years working on creative projects, and what I enjoy most is connecting complex ideas clearly as a team.",phonetic:"ehl plah-SEHR ehs MEE-oh! YEH-voh VAH-ryohs AH-nyohs..."}]},{partnerSpanish:"Me encanta escuchar eso. Aquí trabajamos con clientes en tres husos horarios y a veces cambian las prioridades a última hora. ¿Cómo sueles manejar esos momentos de presión?",partnerEnglish:"Love hearing that. Here we work across three time zones and sometimes priorities shift last minute. How do you usually handle those high-pressure moments?",partnerPhonetic:"meh ehn-KAHN-tah ehs-koo-CHAR EH-soh... KOH-moh SWEH-lehs mah-neh-HAR...",coachNoteEnglish:'Use "Suelo + infinitive" ("I usually...") + connectors like "primero / además"!',suggestedReplies:[{spanish:"Cuando surge un imprevisto, suelo mantener la calma, priorizar lo más urgente y asegurarme de que todo el equipo esté al tanto.",english:"When something unexpected crops up, I usually stay calm, prioritize what’s urgent, and make sure the whole team stays in the loop.",phonetic:"KWAHN-doh SOOR-heh oon eem-preh-VEES-toh, SWEH-loh mahn-teh-NEHR lah KAHL-mah..."}]},{partnerSpanish:"Clarísimo, justo esa proactividad valoramos muchísimo. Antes de cerrar esta primera charla, ¿tienes alguna pregunta para mí sobre el puesto o el estudio?",partnerEnglish:"Super clear—that exact proactivity is what we value most. Before wrapping up this first chat, do you have any questions for me about the role or studio?",partnerPhonetic:"klah-REE-see-moh... TYEH-nehs ahl-GOO-nah preh-GOON-tah PAH-rah mee?",coachNoteEnglish:'Ask a thoughtful question using conditional "¿Cómo describirías...?"!',suggestedReplies:[{spanish:"Sí, me encantaría saber cómo describirías la cultura de colaboración del equipo en el día a día.",english:"Yes, I’d love to hear how you would describe the team’s day-to-day collaborative culture.",phonetic:"see, meh ehn-kahn-tah-REE-ah sah-BEHR KOH-moh dehs-kree-bee-REE-ahs..."}]}]},{id:"rp-chal-lease",title:"Viewing & Negotiating an Apartment in Madrid",setting:"Sunlit Malasaña Apartment Viewing",location:"Madrid, Spain",level:"challenging",partnerId:"valentina",partnerRoleInScenario:"Apartment Owner",englishSituationBrief:"
