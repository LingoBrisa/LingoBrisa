,{spanish:"No tomo café. Prefiero un jugo de naranja o agua.",english:"I don’t drink coffee. I prefer orange juice or water.",phonetic:"noh TOH-moh kah-FEH. preh-FYEH-roh oon HOO-goh deh nah-RAHN-hah oh AH-gwah."}]},{id:"topic-int-weekend",title:"Catching Up About Your Weekend & Hobbies",englishDescription:"Practice past-tense stories, weekend routines, and asking follow-up questions.",level:"intermediate",defaultPartnerId:"mateo",openingSpanish:"¡Qué onda! Qué gusto saludarte. El sábado fui a un concierto al aire libre y estuvo increíble. ¿Qué hiciste tú el fin de semana?",openingEnglish:"What’s up! Great to say hi. Saturday I went to an outdoor concert and it was incredible. What did you do over the weekend?",openingPhonetic:"keh OHN-dah! keh GOOS-toh sah-loo-DAR-teh. ehl SAH-bah-doh fwee ah oon kohn-SYEHR-toh ahl AI-reh LEE-breh...",openingGrammarNote:'"¡Qué onda!" is Mexico’s friendly everyday way to say "What’s up / Hey!"',initialSuggestions:[{spanish:"¡Qué genial! Yo salí a cenar con amigos el sábado y el domingo descansé en casa.",english:"How cool! I went out to dinner with friends on Saturday and rested at home Sunday.",phonetic:"keh heh-NYAHL! yoh sah-LEE ah seh-NAR kohn ah-MEE-gohs..."},{spanish:"Tuve un fin de semana tranquilo: cociné mucho y vi una película muy buena.",english:"I had a chill weekend: I cooked a lot and watched a really good movie.",phonetic:"TOO-veh oon feen deh seh-MAH-nah trahn-KEE-loh: koh-see-NEH MOO-choh..."},{spanish:"Fui a caminar a las montañas porque hacía muy buen tiempo. ¿Qué tipo de música escuchaste?",english:"I went hiking in the mountains because the weather was nice. What kind of music did you hear?",phonetic:"fwee ah kah-mee-NAR ah lahs mohn-TAH-nyahs..."}]},{id:"topic-int-travel",title:"Dream Trips & Favorite Neighborhoods",englishDescription:"Talk about places you have visited or want to explore next.",level:"intermediate",defaultPartnerId:"mateo",openingSpanish:"Últimamente tengo muchas ganas de viajar cerca del mar. ¿Cuál es el lugar más bonito que has visitado o adónde te gustaría viajar pronto?",openingEnglish:"Lately I really feel like traveling near the ocean. What is the prettiest place you’ve visited, or where would you like to travel soon?",openingPhonetic:"OOL-tee-mah-mehn-teh TEHN-goh MOO-chahs GAH-nahs deh vyah-HAR SEHR-kah dehl mar...",openingGrammarNote:'"Tener ganas de + infinitive" = "To really feel like / look forward to doing something."',initialSuggestions:[{spanish:"Me encantaría viajar a España o México pronto por la comida y la arquitectura.",english:"I would love to travel to Spain or Mexico soon for the food and architecture.",phonetic:"meh ehn-kahn-tah-REE-ah vyah-HAR ah ehs-PAH-nyah oh MEH-hee-koh..."},{spanish:"El año pasado fui a la costa y me enamoré de los atardeceres.",english:"Last year I went to the coast and fell in love with the sunsets.",phonetic:"ehl AH-nyoh pah-SAH-doh fwee ah lah KOHS-tah..."},{spanish:"Prefiero las ciudades pequeñas con mucha naturaleza cerca. ¿Qué playa recomiendas?",english:"I prefer small cities with lots of nature nearby. Which beach do you recommend?",phonetic:"preh-FYEH-roh lahs syoo-DAH-dehs peh-KEH-nyahs..."}]},{id:"topic-chal-remote",title:"Modern Work, Technology & Work-Life Balance",englishDescription:"Debate remote work, creative habits, and city life using nuanced connectors & subjunctive.",level:"challenging",defaultPartnerId:"valentina",openingSpanish:"¡Buenas! Estaba grabando un episodio sobre cómo el trabajo remoto cambió nuestras ciudades. Por un lado da muchísima libertad, pero cuesta desconectar. ¿Vos qué opinás—preferirías trabajar siempre desde casa o en un estudio compartido?",openingEnglish:"Hey there! I was recording an episode on how remote work changed our cities. On one hand it gives tons of freedom, yet unplugging is tough. What do you think—would you rather work from home forever or in a shared studio?",openingPhonetic:"BWEH-nahs! ehs-TAH-bah grah-BAHN-doh oon eh-pee-SOH-dyoh SOH-breh KOH-moh ehl trah-BAH-hoh reh-MOH-toh...",openingGrammarNote:'Valentina uses Rioplatense "vos opinás" (Argentine equivalent of "tú opinas")—you can reply naturally using regular "tú" Spanish!',initialSuggestions:[{spanish:"Entiendo ambos lados; sin embargo, preferiría un modelo híbrido para no perder el contacto humano.",english:"I see both sides; however, I would prefer a hybrid model so I don’t lose human connection.",phonetic:"ehn-TYEHN-doh AHM-bohs LAH-dohs; seen ehm-BAR-goh..."},{spanish:"Si pudiera elegir libremente, trabajaría desde cafeterías distintas cada mañana.",english:"If I could choose freely, I would work from different coffee shops every morning.",phonetic:"see poo-DYEH-rah eh-leh-HEER lee-breh-MEHN-teh..."},{spanish:"No creo que el problema sea trabajar desde casa, sino que nos cuesta poner límites claros.",english:"I don’t think the issue is working from home, rather that setting clear boundaries is hard for us.",phonetic:"noh KREH-oh keh ehl proh-BLEH-mah SEH-ah trah-bah-HAR DEHS-deh KAH-sah..."}]},{id:"topic-chal-culture",title:"Learning Languages, Travel & Stepping Outside Your Comfort Zone",englishDescription:"Express hypotheticals, personal growth stories, and cultural reflections.",level:"challenging",defaultPartnerId:"valentina",openingSpanish:"Siempre digo que aprender otro idioma te obliga a reinventar un poco tu personalidad, aunque al principio dé vértigo equivocarse. ¿Qué ha sido lo más retador o gratificante para ti al aprender español?",openingEnglish:"I always say learning another language pushes you to reinvent your personality a bit, even if making mistakes feels intimidating at first. What has been the most challenging or rewarding part of learning Spanish for you?",openingPhonetic:"SYEHM-preh DEE-goh keh ah-prehn-DEHR OH-troh ee-DYOH-mah...",openingGrammarNote:'"Aunque al principio dé vértigo" uses subjunctive "dé" (from dar) to acknowledge a feeling gracefully.',initialSuggestions:[{spanish:"Al principio me daba miedo equivocarme, pero me di cuenta de que la gente valora muchísimo el esfuerzo.",english:"At first I was afraid of messing up, but I realized people deeply appreciate the effort.",phonetic:"ahl preen-SEE-pyoh meh DAH-bah MYEH-doh eh-kee-voh-KAR-meh..."},{spanish:"Lo más retador es entender cuando hablan rápido, aunque cada semana noto que avanzo más.",english:"The hardest part is understanding fast speech, although each week I notice more progress.",phonetic:"loh mahs reh-tah-DOR ehs ehn-tehn-DEHR KWAHN-doh AH-blahn RRAH-pee-doh..."}]}];function cv(g){const E=g.toLowerCase();if(/\byo gusto\b|\byo gusta\b/.test(E))return'Gentle English-to-Spanish tip: Instead of "Yo gusto...", Spanish says "Me gusta..." (literally "It pleases me")—for example: "Me gusta mucho el café." Great job jumping right in!';if(/\bestoy bueno\b|\bestoy buena\b/.test(E))return'Quick native tip: Use "Estoy muy bien" for "I am doing well!" ("Estoy bueno/a" jokingly means "I look attractive" in everyday Spanish!).';if(/\bsoy \d+ años\b|\bestoy \d+ años\b/.test(E))return'Helpful age tip: Spanish expresses age with TENER ("to have") rather than "to be"—say "Tengo 25 años" instead of "Soy 25 años"!';if(/\bembarazada\b|\bembarazado\b/.test(E))return'Classic false friend catch! "Embarazada" means pregnant. To say "embarrassed", use "avergonzado / avergonzada" or "me da pena"!';if(/\bgracias para\b/.test(E))return'Tiny preposition polish: Always pair "Gracias" with "por" ("Gracias por todo") rather than "para"! Everything else looks super clear.'}function uv(g){const E=g.toLowerCase().trim();return["how do i say","what does","i am ","i'm ","i like ","i love ","my name is","where is","can we","i went ","i work ","because i ","thank you"].some(O=>E.includes(O))?E.includes("my name is")?{isMostlyEnglish:!0,helperNote:'English Helper: You used English—no problem at all! In Spanish, try saying: "Me llamo..." (My name is...).'}:E.includes("i like")||E.includes("i love")?{isMostlyEnglish:!0,helperNote:'English Helper: Awesome thought! To say that in Spanish, start with "Me gusta..." (I like...) or "Me encanta..." (I love...).'}:E.includes("i'm from")||E.includes("i am from")?{isMostlyEnglish:!0,helperNote:'English Helper: In Spanish you can say "Soy de..." ("I am from..."), e.g. "Soy de Washington."'}:{isMostlyEnglish:!0,helperNote:"English Helper: I understood your English message right away! Try mixing in a few Spanish words from the suggested bubbles below whenever you feel ready."}:{isMostlyEnglish:!1}}function hv(g,E,A,u){const O=g.toLowerCase(),S=cv(g),Z=uv(g),H=S||Z.helperNote||(u%2===0?"Nice natural phrasing! Your message is clear and easy for any native speaker to follow.":void 0);if(O.includes("llamo")||O.includes("my name")||O.includes("soy de")||O.includes("estados unidos"))return A==="beginner"?{spanish:`¡Mucho gusto! Yo vivo en ${E.city}. ¿De qué ciudad eres tú y qué te gusta hacer en tu tiempo libre?`,english:`Nice to meet you! I live in ${E.city}. What city are you from, and what do you like to do in your free time?`,phonetic:`MOO-choh GOOS-toh! yoh VEE-voh ehn ${E.city}. deh keh syoo-DAHD EH-rehs too ee keh teh GOOS-tah ah-SEHR?`,coachFeedback:H,grammarHighlight:'"Tiempo libre" means "free time" (literally "time free"—adjectives usually come AFTER nouns in Spanish!).',nextSuggestions:[{spanish:"Vivo en Washington. Me gusta leer, caminar y escuchar música.",english:"I live in Washington. I like reading, walking, and listening to music.",phonetic:"VEE-voh ehn Washington. meh GOOS-tah leh-EHR, kah-mee-NAR..."},{spanish:"Soy de Estados Unidos. Me encanta cocinar para mi familia.",english:"I am from the US. I love cooking for my family.",phonetic:"soy deh ehs-TAH-dohs oo-NEE-dohs. meh ehn-KAHN-tah koh-see-NAR..."},{spanish:"Me gusta viajar y probar comida nueva. ¿Y a ti?",english:"I like traveling and trying new food. How about you?",phonetic:"meh GOOS-tah vyah-HAR ee proh-BAR koh-MEE-dah NWEH-vah. ee ah TEE?"}]}:{spanish:`¡Un placer conocerte! Aquí en ${E.city} el ambiente está súper animado hoy. Cuéntame, ¿qué te motivó a aprender español?`,english:`A pleasure meeting you! Here in ${E.city} the vibe is super lively today. Tell me, what motivated you to learn Spanish?`,phonetic:`oon plah-SEHR koh-noh-SEHR-teh! ah-KEE ehn ${E.city} ehl ahm-BYEHN-teh ehs-TAH SOO-pehr ah-nee-MAH-doh oy...`,coachFeedback:H,grammarHighlight:'"Cuéntame" ("Tell me") comes from "contar" and invites someone to share a story warmly.',nextSuggestions:[{spanish:"Quiero viajar por Latinoamérica y España pudiendo hablar con la gente local.",english:"I want to travel around Latin America and Spain able to chat with locals.",phonetic:"KYEH-roh vyah-HAR por lah-tee-noh-ah-MEH-ree-kah..."},{spanish:"Tengo amigos y compañeros que hablan español y quiero comunicarme mejor.",english:"I have Spanish-speaking friends and coworkers and want to communicate better.",phonetic:"TEHN-goh ah-MEE-gohs ee kohm-pah-NYEH-rohs..."}]};if(O.includes("café")||O.includes("té")||O.includes("comida")||O.includes("cenar")||O.includes("cocin"))return A==="beginner"?{spanish:"¡Qué rico! A mí también me encanta. Aquí desayunamos pan tostado con tomate o fruta fresca. ¿Qué desayunas tú normalmente?",english:"Yum! I love that too. Here we eat toasted bread with tomato or fresh fruit for breakfast. What do you normally eat for breakfast?",phonetic:"keh RREE-koh! ah mee tahm-BYEHN meh ehn-KAHN-tah. keh deh-sah-YOO-nahs too nor-mahl-MEHN-teh?",coachFeedback:H,grammarHighlight:'"¡Qué rico!" is the universal Spanish exclamation for "How delicious / Yum!"',nextSuggestions:[{spanish:"Normalmente desayuno huevos con pan tostado y fruta.",english:"Normally I eat eggs with toast and fruit for breakfast.",phonetic:"nor-mahl-MEHN-teh deh-sah-YOO-noh WEH-vohs kohn pahn tohs-TAH-doh..."},{spanish:"Desayuno avena o yogur, algo rápido antes de trabajar.",english:"I have oatmeal or yogurt, something quick before working.",phonetic:"deh-sah-YOO-noh ah-VEH-nah oh yoh-GOOR..."},{spanish:"Solo tomo un café grande por la mañana. ¡No tengo mucha hambre temprano!",english:"I only drink a large coffee in the morning. I’m not very hungry early!",phonetic:"SOH-loh TOH-moh oon kah-FEH GRAHN-deh..."}]}:{spanish:"¡Uf, me diste hambre! La gastronomía es mi forma favorita de conocer otra cultura. Si armáramos una cena ideal esta noche, ¿qué plato no podría faltar en tu mesa?",english:"Ooh, you made me hungry! Food is my favorite way to experience another culture. If we put together an ideal dinner tonight, what dish couldn’t be missing from your table?",phonetic:"oof, meh DEES-teh AHM-breh! see ar-MAH-rah-mohs OO-nah SEH-nah ee-deh-AHL...",coachFeedback:H,grammarHighlight:'"Me diste hambre" = literally "You gave me hunger" ("You made me hungry!").',nextSuggestions:[{spanish:"Sin duda pondría unas tapas variadas o tacos caseros con salsa picante.",english:"Without a doubt I’d put out assorted tapas or homemade tacos with spicy salsa.",phonetic:"seen DOO-dah pohn-DREE-ah OO-nahs TAH-pahs..."},{spanish:"Me encanta la pasta fresca hecha en casa y una buena charla de sobremesa.",english:"I love homemade fresh pasta and a great lingering table chat afterward.",phonetic:"meh ehn-KAHN-tah lah PAHS-tah FREHS-kah..."}]};const M={beginner:[{spanish:"¡Qué interesante! Hablas muy claro. Y dime, ¿qué clima hace hoy donde vives? Aquí hace mucho sol.",english:"How interesting! You speak very clearly. Tell me, what is the weather like today where you live? Here it is very sunny.",phonetic:"keh een-teh-reh-SAHN-teh! AH-blahs mwee KLAH-roh. keh KLEE-mah AH-seh oy DOHN-deh VEE-vehs?",coachFeedback:H,grammarHighlight:'Weather in Spanish often uses HACER: "Hace sol" (sunny), "Hace frío" (cold), "Hace calor" (hot).',nextSuggestions:[{spanish:"Aquí hace un poco de frío hoy, pero el cielo está bonito.",english:"Here it is a little cold today, but the sky is pretty.",phonetic:"ah-KEE AH-seh oon POH-koh deh FREE-oh oy..."},{spanish:"Hoy hace buen tiempo y sol. Quiero caminar por el parque.",english:"Today the weather is nice and sunny. I want to walk in the park.",phonetic:"oy AH-seh bwehn TYEHM-poh ee sohl..."},{spanish:"Está lloviendo un poco hoy, perfecto para leer en casa.",english:"It is raining a little today, perfect for reading at home.",phonetic:"ehs-TAH yoh-VYEHN-doh oon POH-koh oy..."}]},{spanish:"¡Me encanta ese plan! Por cierto, ¿tienes mascotas en casa? Yo tengo un perro pequeño que se llama Bruno.",english:"I love that plan! By the way, do you have pets at home? I have a small dog named Bruno.",phonetic:"meh ehn-KAHN-tah EH-seh plahn! TYEH-nehs mahs-KOH-tahs ehn KAH-sah?",coachFeedback:H,grammarHighlight:'"Por cierto" is a super handy connector meaning "By the way".',nextSuggestions:[{spanish:"¡Qué lindo! Sí, tengo un perro también y es muy juguetón.",english:"How cute! Yes, I have a dog too and he is very playful.",phonetic:"keh LEEN-doh! see, TEHN-goh oon PEH-rroh tahm-BYEHN..."},{spanish:"Tengo un gato tranquilo que duerme todo el día.",english:"I have a calm cat that sleeps all day.",phonetic:"TEHN-goh oon GAH-toh trahn-KEE-loh..."},{spanish:"Ahora no tengo mascotas, pero me gustan mucho los perros.",english:"Right now I don’t have pets, but I really like dogs.",phonetic:"ah-OH-rah noh TEHN-goh mahs-KOH-tahs..."}]},{spanish:"¡Qué bien lo estás haciendo! Una pregunta más: ¿prefieres ver películas en casa o escuchar música cuando quieres relajarte?",english:"You are doing so well! One more question: do you prefer watching movies at home or listening to music when you want to relax?",phonetic:"keh byehn loh ehs-TAHS ah-SYEHN-doh! preh-FYEH-rehs vehr peh-LEE-koo-lahs...",coachFeedback:H,grammarHighlight:'Notice "quieres relajarte" = you want to relax (the "-te" attaches neatly to the end of the infinitive!).',nextSuggestions:[{spanish:"Prefiero escuchar música tranquila por la noche.",english:"I prefer listening to calm music at night.",phonetic:"preh-FYEH-roh ehs-koo-CHAR MOO-see-kah trahn-KEE-lah..."},{spanish:"Me gusta ver series o películas con subtítulos en español.",english:"I like watching shows or movies with Spanish subtitles.",phonetic:"meh GOOS-tah vehr SEH-ryehs oh peh-LEE-koo-lahs..."}]}],intermediate:[{spanish:"Coincido totalmente contigo. Oye, hablando de rutinas, ¿eres más persona de mañanas o rindes mucho mejor por la noche?",english:"I totally agree with you. Hey, speaking of routines, are you more of a morning person or are you much more productive at night?",phonetic:"koyn-SEE-doh toh-tahl-MEHN-teh kohn-TEE-goh. EH-rehs mahs pehr-SOH-nah deh mah-NYAH-nahs...",coachFeedback:H,grammarHighlight:'"Rendir bien" means to perform well / be productive!',nextSuggestions:[{spanish:"Definitivamente rindo mejor por la mañana cuando todo está en silencio.",english:"I definitely focus better in the morning when everything is quiet.",phonetic:"deh-fee-nee-tee-vah-MEHN-teh RREEN-doh meh-HOR por lah mah-NYAH-nah..."},{spanish:"Soy muy nocturno; después de cenar se me ocurren las mejores ideas.",english:"I’m a total night owl; after dinner the best ideas come to me.",phonetic:"soy mwee nohk-TOOR-noh; dehs-PWEHS deh seh-NAR..."}]},{spanish:"¡Qué buena respuesta! Si pudieras escaparte una semana entera a cualquier país hispanohablante el mes que viene, ¿qué ciudad elegirías primero?",english:"Great answer! If you could get away for a full week to any Spanish-speaking country next month, which city would you pick first?",phonetic:"see poo-DYEH-rahs ehs-kah-PAR-teh OO-nah seh-MAH-nah ehn-TEH-rah...",coachFeedback:H,grammarHighlight:'"El mes que viene" ("the month that comes") is the natural way to say "next month".',nextSuggestions:[{spanish:"Elegiría Oaxaca o Ciudad de México para probar mercados locales y museos.",english:"I would pick Oaxaca or Mexico City to explore local markets and museums.",phonetic:"eh-leh-hee-REE-ah wah-HAH-kah oh syoo-DAHD deh MEH-hee-koh..."},{spanish:"Iría a Madrid o Sevilla para caminar por barrios históricos y tomar tapas.",english:"I would go to Madrid or Seville to stroll historic neighborhoods and have tapas.",phonetic:"ee-REE-ah ah mah-DREED oh seh-VEE-yah..."}]}],challenging:[{spanish:"Me parece súper acertado lo que planteas. De hecho, cada vez noto más gente buscando un ritmo de vida más lento. ¿Crees que nos hemos vuelto adictos a estar ocupados todo el tiempo?",english:"What you’re raising strikes me as spot-on. In fact, more and more I notice people seeking a slower pace of life. Do you think we’ve become addicted to staying busy all the time?",phonetic:"meh pah-REH-seh SOO-pehr ah-sehr-TAH-doh loh keh plahn-TEH-ahs...",coachFeedback:H,grammarHighlight:'"Volverse + adjective" expresses a deep or gradual change ("nos hemos vuelto" = we have become).',nextSuggestions:[{spanish:"Totalmente; parece que si no estás produciendo algo, sientes culpa sin razón.",english:"Totally; it feels like if you aren’t producing something, you feel guilty for no reason.",phonetic:"toh-tahl-MEHN-teh; pah-REH-seh keh see noh ehs-TAHS..."},{spanish:"Depende del entorno, aunque creo que las redes sociales amplifican esa presión.",english:"It depends on the environment, although I think social media amplifies that pressure.",phonetic:"deh-PEHN-deh dehl ehn-TOR-noh, AWN-keh KREH-oh..."}]},{spanish:"¡Tal cual! Lo expresaste con una naturalidad increíble. Y cambiando un poco de tema: si tuvieras que recomendarme un libro, serie o película que te haya marcado últimamente, ¿cuál sería?",english:"Spot on! You phrased that remarkably naturally. Changing subjects slightly: if you had to recommend a book, series, or film that left an impression on you lately, what would it be?",phonetic:"tahl kwahl! loh ehks-preh-SAHS-teh kohn OO-nah nah-too-rah-lee-DAHD...",coachFeedback:H,grammarHighlight:'"Que te haya marcado" uses present perfect subjunctive for an open-ended experience.',nextSuggestions:[{spanish:"Vi una serie de misterio hace poco que me mantuvo enganchado de principio a fin.",english:"I watched a mystery series recently that kept me hooked from start to finish.",phonetic:"vee OO-nah SEH-ryeh deh mees-TEH-ryoh AH-seh POH-koh..."},{spanish:"Últimamente prefiero leer ensayos o novelas cortas antes de dormir para desconectar.",english:"Lately I prefer reading essays or short novels before sleep to unplug.",phonetic:"OOL-tee-mah-mehn-teh preh-FYEH-roh leh-EHR..."}]}]}[A];return M[u%M.length]}const $s=[{id:"beg-1",number:1,level:"beginner",title:"Spanish Sounds & Warm Greetings",subtitle:"Say hello naturally at any time of day—with confidence in how every letter sounds.",durationMinutes:6,category:"Foundations",whyItMatters:"Good news for English speakers: Spanish spelling is completely predictable! Once you know how the 5 vowels sound, you can read almost any Spanish word out loud.",slides:[{title:"The Golden Secret: 5 Pure Vowel Sounds",englishExplanation:'Unlike English (where "a" sounds different in cat, cake, and call), each Spanish vowel ALWAYS makes one crisp sound: A (ah), E (eh), I (ee), O (oh), U (oo). Also, the letter "H" is always silent!',examples:[{spanish:"¡Hola! ¿Cómo estás?",english:"Hello! How are you? (friendly / casual)",phonetic:"OH-lah! KOH-moh ehs-TAHS?",literalNote:'Notice the silent "H" in Hola and the upside-down ¿ that signals a question right away!'},{spanish:"¡Buenos días!",english:"Good morning! (used until lunch, around 1–2 PM)",phonetic:"BWEH-nohs DEE-ahs"},{spanish:"¡Buenas tardes! / ¡Buenas noches!",english:"Good afternoon! / Good evening or good night!",phonetic:"BWEH-nahs TAR-dehs / BWEH-nahs NOH-chehs"}],proTip:'In casual everyday life across Spain and Latin America, people often shorten these to just "¡Buenas!" (BWEH-nahs)—it works morning, afternoon, or night!'},{title:'Answering "How Are You?" & Polite Replies',englishExplanation:'When someone asks "¿Cómo estás?" or the casual "¿Qué tal?" (What’s up / How’s it going?), keep your response warm and add "¿Y tú?" (And you?).',examples:[{spanish:"Muy bien, gracias. ¿Y tú?",english:"Very well, thank you. And you?",phonetic:"mwee BYEHN, GRAH-syahs. ee TOO?"},{spanish:"Todo bien, ¿qué tal?",english:"All good, how’s it going?",phonetic:"TOH-doh BYEHN, keh TAHL?"},{spanish:"¡Mucho gusto! / ¡Hasta luego!",english:"Nice to meet you! / See you later!",phonetic:"MOO-choh GOOS-toh / AHS-tah LWEH-goh",literalNote:'Literally "Much pleasure!"—friendly and polite with anyone.'}],proTip:'Use "¿Y tú?" with friends, peers, and family. Use "¿Y usted?" (ee oos-TEHD) to show extra respect to elders, doctors, or strangers in formal settings.'}],quiz:[{id:"beg-1-q1",type:"multiple-choice",promptEnglish:"You walk into a bakery at 9:30 AM. How do you greet the baker?",options:["¡Buenas noches!","¡Buenos días!","¡Hasta mañana!","Lo siento"],correctAnswer:"¡Buenos días!",explanationEnglish:'¡Buenos días! means "Good morning!" and is used from morning until lunchtime.'},{id:"beg-1-q2",type:"word-order",promptEnglish:'Build the Spanish phrase for: "Very well, thank you. And you?"',options:["tú?","bien,","Muy","¿Y","gracias."],correctAnswer:"Muy bien, gracias. ¿Y tú?",orderedTarget:["Muy","bien,","gracias.","¿Y","tú?"],explanationEnglish:'"Muy bien, gracias. ¿Y tú?" is the most natural, polite everyday reply in Spanish.'},{id:"beg-1-q3",type:"multiple-choice",promptEnglish:'How is the letter "H" pronounced in Spanish words like "Hola" and "Hasta"?',options:["It is completely silent",'Like a hard "K" sound','Exactly like English "H" in hat','Like an English "S"'],correctAnswer:"It is completely silent",explanationEnglish:'Alone, the Spanish letter H is 100% silent—so "Hola" sounds just like "OH-lah"!'}]},{id:"beg-2",number:2,level:"beginner",title:"Introducing Yourself & Survival Phrases",subtitle:"Share your name, where you are from, and ask native speakers to slow down politely.",durationMinutes:7,category:"Foundations",whyItMatters:'Knowing 3 polite "learner survival phrases" removes all anxiety when speaking with native Spanish speakers—people love helping when you tell them you are learning!',slides:[{title:"Who You Are & Where You Are From",englishExplanation:'Instead of saying "My name is...", Spanish speakers usually say "Me llamo..." (Literally: "I call myself..."). To say where you are from, simply use "Soy de..." ("I am from...").',examples:[{spanish:"Hola, me llamo Alex. Soy de Estados Unidos.",english:"Hi, my name is Alex. I am from the United States.",phonetic:"OH-lah, meh YAH-moh AH-leks. soy deh ehs-TAH-dohs oo-NEE-dohs",literalNote:'Double "LL" sounds like an English "Y" in most Spanish-speaking countries.'},{spanish:"¿Cómo te llamas? ¿De dónde eres?",english:"What is your name? Where are you from?",phonetic:"KOH-moh teh YAH-mahs? deh DOHN-deh EH-rehs?"}],proTip:'You never need the word "Yo" (I) before "Soy" or "Me llamo" unless you want extra emphasis—the verb ending already tells the listener you mean "I"!'},{title:"Your Beginner Safety Net Phrases",englishExplanation:"Keep these three phrases in your pocket! Whenever a conversation moves too fast, use one of these and watch the other person immediately smile and slow down.",examples:[{spanish:"Estoy aprendiendo español.",english:"I am learning Spanish.",phonetic:"ehs-TOY ah-prehn-DYEHN-doh ehs-pah-NYOHL"},{spanish:"¿Puedes hablar más despacio, por favor?",english:"Can you speak slower, please?",phonetic:"PWEH-dehs ah-BLAR mahs dehs-PAH-syoh, por fah-VOR"},{spanish:'¿Cómo se dice "water" en español?',english:'How do you say "water" in Spanish?',phonetic:'KOH-moh seh DEE-seh "water" ehn ehs-pah-NYOHL'}],proTip:'"Más despacio, por favor" (Slower, please) is magic—even alone as four words, every Spanish speaker understands and appreciates it!'}],quiz:[{id:"beg-2-q1",type:"multiple-choice",promptEnglish:"Someone speaks super fast to you. How do you politely ask them to speak slower?",options:["¿Puedes hablar más despacio, por favor?","Tengo mucha hambre, gracias.","Soy de Estados Unidos.","¿Dónde está el hotel?"],correctAnswer:"¿Puedes hablar más despacio, por favor?",explanationEnglish:'"Más despacio" means "slower"—your most useful beginner lifeline!'},{id:"beg-2-q2",type:"word-order",promptEnglish:'Arrange the words to say: "I am learning Spanish."',options:["español.","aprendiendo","Estoy"],correctAnswer:"Estoy aprendiendo español.",orderedTarget:["Estoy","aprendiendo","español."],explanationEnglish:"Estoy (I am) + aprendiendo (learning) + español (Spanish)."},{id:"beg-2-q3",type:"multiple-choice",promptEnglish:'How do you ask someone "Where are you from?" in casual Spanish?',options:["¿De dónde eres?","¿Cómo estás?","¿Qué hora es?","Mucho gusto"],correctAnswer:"¿De dónde eres?",explanationEnglish:'"De" (from) + "dónde" (where) + "eres" (are you) = "Where are you from?"'}]},{id:"beg-3",number:3,level:"beginner",title:"Ordering at Cafés & Restaurants",subtitle:"Order drinks, meals, and ask for the check smoothly without sounding stiff.",durationMinutes:7,category:"Real-Life Travel",whyItMatters:'In English we say "Can I get a coffee?", which translates awkwardly word-for-word. Spanish uses super easy, polite phrases you can use at every café and taco stand.',slides:[{title:"Polite Ways to Order Anything",englishExplanation:'Avoid translating "Can I have..." directly. Instead, use "Quisiera..." (I would like...) or the ultra-natural "¿Me pones...?" / "¿Me das...?" (Could you get me...?).',examples:[{spanish:"Hola, quisiera un café con leche, por favor.",english:"Hi, I would like a coffee with milk, please.",phonetic:"OH-lah, kee-SYEH-rah oon kah-FEH kohn LEH-cheh, por fah-VOR"},{spanish:"¿Me traes un vaso de agua y dos tacos?",english:"Could you bring me a glass of water and two tacos?",phonetic:"meh TRAH-ehs oon VAH-soh deh AH-gwah ee dohs TAH-kohs"},{spanish:"Para llevar / Para tomar aquí",english:"To go / For here",phonetic:"PAH-rah yeh-VAR / PAH-rah toh-MAR ah-KEE"}],proTip:'Notice "un" vs "una": nouns ending in -o usually take "un" (un vaso), while nouns ending in -a usually take "una" (una mesa - a table).'},{title:"Checking Ingredients & Paying the Bill",englishExplanation:"When you finish eating, waiters in Spain and Latin America rarely drop the check early because rushing guests is considered rude! You always ask for it politely.",examples:[{spanish:"¿Qué me recomiendas?",english:"What do you recommend?",phonetic:"keh meh reh-koh-MYEHN-dahs"},{spanish:"Soy vegetariano / No como carne.",english:"I am vegetarian (masc., use -a for fem.) / I don’t eat meat.",phonetic:"soy veh-heh-tah-RYAH-noh / noh KOH-moh KAR-neh"},{spanish:"La cuenta, por favor. ¿Puedo pagar con tarjeta?",english:"The check, please. Can I pay by card?",phonetic:"lah KWEHN-tah, por fah-VOR. PWEH-doh pah-GAR kohn tar-HEH-tah?"}],proTip:'Making eye contact and smiling with "Disculpa, ¿la cuenta, por favor?" works warmly in every Spanish-speaking country.'}],quiz:[{id:"beg-3-q1",type:"multiple-choice",promptEnglish:'How do you ask the server for "The check, please"?',options:["La cuenta, por favor.","Un café para llevar.","Mucho gusto, amigo.","¿Dónde está el baño?"],correctAnswer:"La cuenta, por favor.",explanationEnglish:'"La cuenta" means the bill / check at a café or restaurant.'},{id:"beg-3-q2",type:"word-order",promptEnglish:'Order politely: "I would like a coffee with milk, please."',options:["con leche,","un café","Quisiera","por favor."],correctAnswer:"Quisiera un café con leche, por favor.",orderedTarget:["Quisiera","un café","con leche,","por favor."],explanationEnglish:'"Quisiera" (I would like) sounds polite and natural everywhere.'},{id:"beg-3-q3",type:"multiple-choice",promptEnglish:'The barista asks: "¿Para aquí o para llevar?" What are they asking?',options:["For here or to go?","Hot or iced?","Cash or credit card?","Small or large?"],correctAnswer:"For here or to go?",explanationEnglish:'"Para aquí" = for here; "para llevar" = to go / takeaway!'}]},{id:"beg-4",number:4,level:"beginner",title:"Essential Questions, Time & Prices",subtitle:"Master the 6 power question words to navigate shops, streets, and schedules.",durationMinutes:6,category:"Real-Life Travel",whyItMatters:"Every Spanish question word wears a written accent mark (Qué, Dónde, Cuándo, Cuánto, Cómo, Quién)—making them super easy to spot when reading messages!",slides:[{title:"The Big Question Words",englishExplanation:'Combine any question word with "está" (is located) or "es" (is) to ask dozens of helpful everyday questions.',examples:[{spanish:"¿Dónde está el baño / la estación de metro?",english:"Where is the bathroom / the subway station?",phonetic:"DOHN-deh ehs-TAH ehl BAH-nyoh / lah ehs-tah-SYOHN deh MEH-troh"},{spanish:"¿Cuánto cuesta esto?",english:"How much does this cost?",phonetic:"KWAN-toh KWEHS-tah EHS-toh"},{spanish:"¿A qué hora abre / cierra?",english:"At what time does it open / close?",phonetic:"ah keh OH-rah AH-breh / SYEH-rrah"}],proTip:'Start street questions with "Disculpa" (Excuse me) before asking "¿Dónde está...?"—polite openings get much friendlier help!'}],quiz:[{id:"beg-4-q1",type:"multiple-choice",promptEnglish:"You see a handmade ceramic mug at a market. How do you ask the price?",options:["¿Cuánto cuesta esto?","¿Dónde está esto?","¿Quién eres tú?","¿Cómo te llamas?"],correctAnswer:"¿Cuánto cuesta esto?",explanationEnglish:'"¿Cuánto cuesta...?" means "How much does ... cost?"'},{id:"beg-4-q2",type:"word-order",promptEnglish:'Ask politely: "Excuse me, where is the subway station?"',options:["la estación","¿dónde está","Disculpa,","de metro?"],correctAnswer:"Disculpa, ¿dónde está la estación de metro?",orderedTarget:["Disculpa,","¿dónde está","la estación","de metro?"],explanationEnglish:'"Disculpa" softens any question when stopping someone on the street.'}]},{id:"int-1",number:5,level:"intermediate",title:"Ser vs. Estar Without Memorizing Charts",subtitle:'Finally click with Spanish’s two verbs for "to be" using one intuitive English shortcut.',durationMinutes:8,category:"Core Grammar",whyItMatters:'English uses "am / is / are" for everything, whereas Spanish splits "to be" into SER (identity/essence) and ESTAR (current state/location). Mixing them up can accidentally change "I am bored" into "I am boring"!',slides:[{title:"Identity (SER) vs. State & Location (ESTAR)",englishExplanation:"Think of SER as WHO or WHAT something fundamentally is (name, origin, profession, personality, time). Think of ESTAR as HOW or WHERE someone/something is right now (moods, physical feelings, exact locations).",examples:[{spanish:"Soy profesora y soy de Seattle, pero hoy estoy en Madrid.",english:"I am a teacher and I am from Seattle, but today I am in Madrid.",phonetic:"soy proh-feh-SOH-rah ee soy deh Seattle, PEH-roh oy ehs-TOY ehn mah-DREED",literalNote:"Profession & origin = Soy (SER). Location right now = Estoy (ESTAR)."},{spanish:"Estoy aburrido vs. Soy aburrido",english:"I am feeling bored right now vs. I am a boring person!",phonetic:"ehs-TOY ah-boo-RREE-doh / soy ah-boo-RREE-doh"},{spanish:"El café es de Colombia y está muy caliente.",english:"The coffee is from Colombia (origin) and is very hot right now (state).",phonetic:"ehl kah-FEH ehs deh koh-LOHM-byah ee ehs-TAH mwee kah-LYEHN-teh"}],proTip:'Rhyme helper in English: "How you feel and where you are, always use the verb ESTAR!"'}],quiz:[{id:"int-1-q1",type:"multiple-choice",promptEnglish:'You want to tell a friend "I am tired today" without calling yourself a boring/tiring person. Which is right?',options:["Hoy estoy cansado.","Hoy soy cansado.","Hoy tengo cansado.","Hoy hacer cansado."],correctAnswer:"Hoy estoy cansado.",explanationEnglish:'Tiredness is how you feel right now (temporary state), so Spanish uses ESTAR ("estoy").'},{id:"int-1-q2",type:"word-order",promptEnglish:'Build the sentence: "The soup is delicious today!" (talking about how this specific bowl tastes right now)',options:["muy rica","La sopa","hoy!","está"],correctAnswer:"La sopa está muy rica hoy!",orderedTarget:["La sopa","está","muy rica","hoy!"],explanationEnglish:'Spanish uses "está rica" to compliment how a meal tastes right now!'}]},{id:"int-2",number:6,level:"intermediate",title:"Storytelling About Yesterday & Last Weekend",subtitle:"Talk about trips, meals, and memories using high-frequency past tense verbs.",durationMinutes:9,category:"Core Grammar",whyItMatters:'Real conversations aren’t just ordering coffee—friends ask "What did you do this weekend?" Mastering 5 core preterite verbs unlocks 80% of everyday past stories.',slides:[{title:"Completed Past Actions (El Pretérito)",englishExplanation:'To describe finished events with a clear timeframe (yesterday = ayer, last weekend = el fin de semana pasado), use preterite endings. Fun bonus: "Fui" means BOTH "I went" AND "I was"—context always makes it clear!',examples:[{spanish:"El sábado fui al mercado y comí unos tacos increíbles.",english:"On Saturday I went to the market and ate some incredible tacos.",phonetic:"ehl SAH-bah-doh fwee ahl mehr-KAH-doh ee koh-MEE OO-nohs TAH-kohs een-kreh-EE-blehs"},{spanish:"¿Qué hiciste ayer después del trabajo?",english:"What did you do yesterday after work?",phonetic:"keh ee-SEES-teh ah-YEHR dehs-PWEHS dehl trah-BAH-hoh"},{spanish:"Tuve un día muy ocupado, pero la pasé genial.",english:"I had a very busy day, but I had a great time.",phonetic:"TOO-veh oon DEE-ah mwee oh-koo-PAH-doh, PEH-roh lah pah-SEH heh-NYAHL"}],proTip:'"La pasé muy bien" or "Lo pasé genial" is how native speakers naturally say "I had a really good time!"'}],quiz:[{id:"int-2-q1",type:"multiple-choice",promptEnglish:'How do you ask a friend "What did you do yesterday?"',options:["¿Qué hiciste ayer?","¿Qué haces mañana?","¿Dónde fuiste hoy?","¿Cómo estás ayer?"],correctAnswer:"¿Qué hiciste ayer?",explanationEnglish:'"Hiciste" is the past "you did" form of hacer, paired with "ayer" (yesterday).'},{id:"int-2-q2",type:"word-order",promptEnglish:'Say: "Yesterday I went to the café with Sofia."',options:["al café","Ayer","con Sofía.","fui"],correctAnswer:"Ayer fui al café con Sofía.",orderedTarget:["Ayer","fui","al café","con Sofía."],explanationEnglish:'Note that "a + el" contracts automatically into "al" (to the)!'}]},{id:"int-3",number:7,level:"intermediate",title:"Making Plans, Invitations & Polite Rain Checks",subtitle:"Coordinate hangouts over text message like a local friend.",durationMinutes:7,category:"Social Fluency",whyItMatters:'Texting Spanish-speaking friends feels effortless once you know the natural verbs "quedar" (to meet up) and "¿te apetece / te gustaría?" (do you feel like / would you like to?).',slides:[{title:"Inviting Friends & Locking In a Time",englishExplanation:'In Spain "quedar" means to meet up with someone, while across Latin America "vernos" (see each other) or "juntarnos" (get together) are super common too!',examples:[{spanish:"¿Te gustaría tomar un café mañana por la tarde?",english:"Would you like to grab a coffee tomorrow afternoon?",phonetic:"teh goos-tah-REE-ah toh-MAR oon kah-FEH mah-NYAH-nah por lah TAR-deh"},{spanish:"¡Me encantaría! ¿Quedamos a las cinco frente al parque?",english:"I’d love to! Shall we meet at 5:00 in front of the park?",phonetic:"meh ehn-kahn-tah-REE-ah! keh-DAH-mohs ah lahs SEEN-koh FREHN-teh ahl PAR-keh"},{spanish:"¡Qué pena! Hoy no puedo porque tengo trabajo, ¿qué tal el jueves?",english:"What a bummer! I can’t today because I have work—how about Thursday?",phonetic:"keh PEH-nah! oy noh PWEH-doh POR-keh TEHN-goh trah-BAH-hoh, keh tahl ehl HWEH-vehs"}],proTip:'When turning down an invite, native speakers almost always propose an alternative day right away ("¿qué tal el jueves?") to show warmth!'}],quiz:[{id:"int-3-q1",type:"multiple-choice",promptEnglish:'Which phrase enthusiastically accepts an invitation ("I would love to!")?',options:["¡Me encantaría!","No pasa nada.","De ninguna manera.","Todavía no."],correctAnswer:"¡Me encantaría!",explanationEnglish:'"¡Me encantaría!" literally means "It would enchant me!"—the warmest way to say "I’d love to!"'},{id:"int-3-q2",type:"word-order",promptEnglish:'Text your friend: "Shall we meet at eight?"',options:["las","¿Quedamos","ocho?","a"],correctAnswer:"¿Quedamos a las ocho?",orderedTarget:["¿Quedamos","a","las","ocho?"],explanationEnglish:'Spanish expresses clock times with "a las + hour" (except 1:00, which is singular "a la una").'}]},{id:"int-4",number:8,level:"intermediate",title:"City Navigation & Unexpected Travel Hiccups",subtitle:"Understand directions clearly and explain small problems calmly.",durationMinutes:8,category:"Real-Life Travel",whyItMatters:'Asking "Where is X?" is beginner Spanish—ACTUALLY understanding the fast directions coming back at you is the intermediate superpower!',slides:[{title:"Decoding Spoken Street Directions",englishExplanation:'Listen for three anchor words in any street answer: "todo recto / derecho" (straight ahead), "gira / dobla" (turn), and "cuadras / calles" (blocks).',examples:[{spanish:"Sigue todo recto dos cuadras y gira a la izquierda en el semáforo.",english:"Go straight ahead two blocks and turn left at the traffic light.",phonetic:"SEE-geh TOH-doh REHK-toh dohs KWAH-drahs ee HEE-rah ah lah ees-KYEHR-dah ehn ehl seh-MAH-foh-roh"},{spanish:"Se me quedó el teléfono en el taxi. ¿Me ayudas a llamar?",english:"I accidentally left my phone in the taxi. Can you help me call?",phonetic:"seh meh keh-DOH ehl teh-LEH-foh-noh ehn ehl TAHK-see. meh ah-YOO-dahs ah yah-MAR"}],proTip:'Spanish loves the "accidental SE" structure ("Se me cayó" = it slipped from me, "Se me olvidó" = it slipped my mind)—it sounds soft and blameless!'}],quiz:[{id:"int-4-q1",type:"multiple-choice",promptEnglish:'A local tells you: "Sigue derecho y dobla a la derecha." Which way do you go?',options:["Go straight ahead, then turn right","Turn around and go back left","Go downstairs into the subway","Wait right here at the corner"],correctAnswer:"Go straight ahead, then turn right",explanationEnglish:'Watch out for lookalikes: "derecho" = straight ahead, while "a la derecha" = to the right!'}]},{id:"chal-1",number:9,level:"challenging",title:"The Subjunctive Mood Made Intuitive",subtitle:"Express wishes, doubts, emotions, and polite influence just like native speakers.",durationMinutes:10,category:"Advanced Nuance",whyItMatters:'English mostly dropped the subjunctive, so learners overthink it. Think of Indicative as "stating reality" and Subjunctive as "wishing, reacting to, or doubting non-guaranteed outcomes"!',slides:[{title:"The Vowel-Flip Trick & Two-Subject Rule",englishExplanation:'When Person A wants, hopes, doubts, or recommends that Person B do something (connected by "que"), flip the normal ending vowel: -AR verbs take -E endings, and -ER/-IR verbs take -A endings!',examples:[{spanish:"Espero que tengas un buen viaje y que disfrutes muchísimo.",english:"I hope you have a great trip and that you enjoy yourself a ton.",phonetic:"ehs-PEH-roh keh TEHN-gahs oon bwehn VYAH-heh ee keh dees-FROO-tehs moo-CHEE-see-moh"},{spanish:"Te recomiendo que pruebes el pulpo antes de que cierren la cocina.",english:"I recommend you try the octopus before they close the kitchen.",phonetic:"teh reh-koh-MYEHN-doh keh PRWEH-behs ehl POOL-poh AHN-tehs deh keh SYEH-rrehn lah koh-SEE-nah"},{spanish:"No creo que sea tan complicado si nos organizamos bien.",english:"I don’t think it’s that complicated if we organize ourselves well.",phonetic:"noh KREH-oh keh SEH-ah tahn kohm-plee-KAH-doh see nohs or-gah-nee-SAH-mohs byehn",literalNote:'Notice: "Creo que es..." (certainty -> indicative) vs. "No creo que sea..." (doubt -> subjunctive)!'}],proTip:'"¡Que tengas un buen día!" (Have a great day!) secretly uses "[Espero] que tengas..."—say it once a day and the subjunctive becomes muscle memory!'}],quiz:[{id:"chal-1-q1",type:"multiple-choice",promptEnglish:'Complete naturally: "No creo que Mateo _____ llegar a tiempo con este tráfico."',options:["pueda","puede","podía","pudo"],correctAnswer:"pueda",explanationEnglish:'Negated belief ("No creo que...") expresses doubt and triggers present subjunctive: "pueda".'},{id:"chal-1-q2",type:"word-order",promptEnglish:'Assemble the native expression: "I hope everything goes super well for you!"',options:["todo","vaya","¡Espero que","te","súper bien!"],correctAnswer:"¡Espero que todo te vaya súper bien!",orderedTarget:["¡Espero que","todo","te","vaya","súper bien!"],explanationEnglish:'"Vaya" is the subjunctive of "ir"—"que te vaya bien" is iconic authentic Spanish!'}]},{id:"chal-2",number:10,level:"challenging",title:"Diplomatic Disagreement & Persuasion",subtitle:"Debate ideas, negotiate leases or work projects, and soften requests gracefully.",durationMinutes:9,category:"Professional & Social Mastery",whyItMatters:'In professional or nuanced social settings, saying simply "No estoy de acuerdo" sounds blunt. Adding conditional softening ("podríamos", "habría") makes your Spanish sound educated and diplomatic.',slides:[{title:"Validating Before Pivoting",englishExplanation:'Native speakers acknowledge the other person’s point first before introducing a counterpoint with connectors like "sin embargo" (however), "por otro lado" (on the other hand), or "dicho esto" (that being said).',examples:[{spanish:"Entiendo perfectamente tu punto; sin embargo, creo que valdría la pena explorar otra opción.",english:"I completely understand your point; however, I think it would be worth exploring another option.",phonetic:"ehn-TYEHN-doh pehr-fehk-tah-MEHN-teh too POON-toh; seen ehm-BAR-goh, KREH-oh keh vahl-DREE-ah lah PEH-nah ehks-ploh-RAR OH-trah ohp-SYOHN"},{spanish:"Si estuviera en tu lugar, hablaría directamente con la encargada.",english:"If I were in your shoes, I would speak directly with the manager.",phonetic:"see ehs-too-VYEH-rah ehn too loo-GAR, ah-blah-REE-ah dee-rehk-tah-MEHN-teh kohn lah ehn-kar-GAH-dah"}],proTip:'Pair "Si + imperfect subjunctive (-ra)" with "conditional (-ía)" ("Si pudiera, iría" = If I could, I would go) for gold-standard hypothetical fluency!'}],quiz:[{id:"chal-2-q1",type:"multiple-choice",promptEnglish:'Which sentence expresses "If I had more time, I would live in Barcelona" naturally?',options:["Si tuviera más tiempo, viviría en Barcelona.","Si tengo más tiempo, viví en Barcelona.","Cuando tendré tiempo, vivo en Barcelona.","Si tuve más tiempo, viva en Barcelona."],correctAnswer:"Si tuviera más tiempo, viviría en Barcelona.",explanationEnglish:'Hypothetical present/future condition uses "Si tuviera" + conditional "viviría".'}]},{id:"chal-3",number:11,level:"challenging",title:"Por vs. Para & Native Discourse Markers",subtitle:'Stop guessing between "por" and "para" and link thoughts fluidly.',durationMinutes:8,category:"Advanced Nuance",whyItMatters:'English uses "for" for cause AND destination, leading to classic mix-ups like "Gracias para todo" instead of "Gracias por todo".',slides:[{title:"Cause/Exchange (POR) vs. Destination/Goal (PARA)",englishExplanation:'Picture an arrow: POR looks backward at the CAUSE, REASON, DURATION, or EXCHANGE ("because of / in exchange for / through"). PARA points forward toward the DESTINATION, RECIPIENT, or DEADLINE ("in order to / intended for / by Friday").',examples:[{spanish:"Pagué veinte euros por este libro; es un regalo para mi hermana.",english:"I paid twenty euros for (in exchange for) this book; it is a gift for (recipient) my sister.",phonetic:"pah-GEH VEHYN-teh EH-oo-rohs por EHS-teh LEE-broh; ehs oon reh-GAH-loh PAH-rah mee ehr-MAH-nah"},{spanish:"Necesito terminar el informe para el viernes, por eso trabajo desde casa hoy.",english:"I need to finish the report by Friday; that’s why I’m working from home today.",phonetic:"neh-seh-SEE-toh tehr-mee-NAR ehl een-FOR-meh PAH-rah ehl VYEHR-nehs, por EH-soh trah-BAH-hoh DEHS-deh KAH-sah oy"}],proTip:'Memorize 4 fixed chunks that use POR 100% of the time: "Gracias por...", "Por eso" (that’s why), "Por casualidad" (by chance), and "Por lo menos" (at least).'}],quiz:[{id:"chal-3-q1",type:"multiple-choice",promptEnglish:'Fill in the two blanks: "Gracias _____ tu ayuda; este detalle es _____ ti."',options:["por / para","para / por","por / por","para / para"],correctAnswer:"por / para",explanationEnglish:'Gratitude has a cause ("Gracias por tu ayuda"), while a gift goes to a recipient ("es para ti")!'}]},{id:"chal-4",number:12,level:"challenging",title:"Everyday Idioms Across Spain, Mexico & Argentina",subtitle:"Decode colorful expressions you will hear constantly in movies, podcasts, and cafés.",durationMinutes:8,category:"Cultural Immersion",whyItMatters:'Translating idioms word-for-word makes zero sense ("to put on the batteries" = to lock in and focus!). Recognizing them unlocks effortless real-world comprehension.',slides:[{title:"Universal Native Idioms Everyone Loves",englishExplanation:"These vivid expressions work across the entire Spanish-speaking world and make your speech sound immediately warm and authentic.",examples:[{spanish:"¿Me echas una mano con las maletas? — ¡Claro, no pasa nada!",english:"Can you give me a hand with the suitcases? — Of course, no problem at all!",phonetic:"meh EH-chahs OO-nah MAH-noh kohn lahs mah-LEH-tahs? KLAH-roh, noh PAH-sah NAH-dah"},{spanish:"Tengo que ponerme las pilas esta semana porque estoy al tanto del plazo.",english:"I need to step it up / focus this week because I’m aware of the deadline.",phonetic:"TEHN-goh keh poh-NEHR-meh lahs PEE-lahs EHS-tah seh-MAH-nah POR-keh ehs-TOY ahl TAHN-toh dehl PLAH-soh"},{spanish:"¡Qué guay! (Spain) / ¡Qué padre! (Mexico) / ¡Qué copado! (Argentina)",english:"How cool! — Three regional ways native speakers express excitement!",phonetic:"keh GWAI / keh PAH-dreh / keh koh-PAH-doh"}],proTip:'You don’t have to adopt regional slang right away—sticking to neutral universal phrases like "¡Qué genial!" works everywhere while letting you understand everyone else’s local flair!'}],quiz:[{id:"chal-4-q1",type:"multiple-choice",promptEnglish:'A coworker says: "Tenemos que ponernos las pilas con el proyecto." What do they mean?',options:["We need to focus / get energized and get moving on the project.","We need to buy new batteries for our laptops.","We should cancel the project until next month.","We already finished everything ahead of schedule."],correctAnswer:"We need to focus / get energized and get moving on the project.",explanationEnglish:'"Ponerse las pilas" (putting one’s batteries in) is the go-to Spanish idiom for getting motivated and focused!'}]}],bi=[{id:"v-b1",spanish:"¡Hola! ¿Cómo estás?",english:"Hello! How are you?",phonetic:"OH-lah! KOH-moh ehs-TAHS?",partOfSpeech:"Phrase",genderTip:"Works with anyone of any gender! Remember the silent H.",exampleSpanish:"¡Hola! ¿Cómo estás hoy? — Muy bien, gracias.",exampleEnglish:"Hello! How are you today? — Very well, thank you.",level:"beginner",category:"Greetings & Survival"},{id:"v-b2",spanish:"Por favor / Muchas gracias",english:"Please / Thank you very much",phonetic:"por fah-VOR / MOO-chahs GRAH-syahs",partOfSpeech:"Phrase",genderTip:'"Gracias" is feminine plural, so it always pairs with "Muchas".',exampleSpanish:"Un té verde, por favor. ¡Muchas gracias!",exampleEnglish:"A green tea, please. Thank you very much!",level:"beginner",category:"Greetings & Survival"},{id:"v-b3",spanish:"Disculpa / Perdón",english:"Excuse me / Sorry",phonetic:"dees-KOOL-pah / pehr-DOHN",partOfSpeech:"Interjection",genderTip:'Use "Disculpa" to politely get someone’s attention, and "Perdón" if you bump into someone.',exampleSpanish:"Disculpa, ¿tienes hora?",exampleEnglish:"Excuse me, do you have the time?",level:"beginner",category:"Greetings & Survival"},{id:"v-b4",spanish:"Más despacio, por favor",english:"Slower, please",phonetic:"mahs dehs-PAH-syoh, por fah-VOR",partOfSpeech:"Survival Phrase",genderTip:"Your #1 beginner superpower whenever someone talks quickly.",exampleSpanish:"Estoy aprendiendo español. ¿Más despacio, por favor?",exampleEnglish:"I am learning Spanish. Slower, please?",level:"beginner",category:"Greetings & Survival"},{id:"v-b5",spanish:"No entiendo / ¿Qué significa...?",english:"I don’t understand / What does ... mean?",phonetic:"noh ehn-TYEHN-doh / keh seeg-nee-FEE-kah",partOfSpeech:"Survival Phrase",exampleSpanish:'Perdón, ¿qué significa la palabra "propina"?',exampleEnglish:'Sorry, what does the word "propina" (tip) mean?',level:"beginner",category:"Greetings & Survival"},{id:"v-b6",spanish:"La cuenta, por favor",english:"The check / bill, please",phonetic:"lah KWEHN-tah, por fah-VOR",partOfSpeech:"Noun Phrase",genderTip:'Feminine noun ("la cuenta"). Waiters wait for you to ask!',exampleSpanish:"Todo estuvo delicioso. ¿Nos traes la cuenta, por favor?",exampleEnglish:"Everything was delicious. Could you bring us the check, please?",level:"beginner",category:"Food & Café"},{id:"v-b7",spanish:"Quisiera...",english:"I would like...",phonetic:"kee-SYEH-rah",partOfSpeech:"Polite Verb",genderTip:'Much smoother and politer than saying "Quiero" (I want)!',exampleSpanish:"Quisiera una mesa para dos personas.",exampleEnglish:"I would like a table for two people.",level:"beginner",category:"Food & Café"},{id:"v-b8",spanish:"El agua (con gas / sin gas)",english:"Water (sparkling / still)",phonetic:"ehl AH-gwah (kohn gahs / seen gahs)",partOfSpeech:"Noun",genderTip:'Uses "el" in singular for smooth sound, even though agua is feminine ("agua fría").',exampleSpanish:"Un vaso de agua sin gas, por favor.",exampleEnglish:"A glass of still water, please.",level:"beginner",category:"Food & Café"},{id:"v-b9",spanish:"El desayuno / El almuerzo / La cena",english:"Breakfast / Lunch / Dinner",phonetic:"ehl deh-sah-YOO-noh / ehl ahl-MWEHR-soh / lah SEH-nah",partOfSpeech:"Nouns",genderTip:"Breakfast & lunch are masculine (el); dinner is feminine (la).",exampleSpanish:"¿A qué hora sirven el desayuno en el hotel?",exampleEnglish:"What time do they serve breakfast at the hotel?",level:"beginner",category:"Food & Café"},{id:"v-b10",spanish:"¿Dónde está el baño?",english:"Where is the bathroom?",phonetic:"DOHN-deh ehs-TAH ehl BAH-nyoh",partOfSpeech:"Question",genderTip:'In Spain you may also hear "el servicio" or "el aseo".',exampleSpanish:"Disculpa, ¿dónde está el baño? — Al fondo a la derecha.",exampleEnglish:"Excuse me, where is the bathroom? — In the back on the right.",level:"beginner",category:"Travel & Directions"},{id:"v-b11",spanish:"A la izquierda / A la derecha",english:"To the left / To the right",phonetic:"ah lah ees-KYEHR-dah / ah lah deh-REH-chah",partOfSpeech:"Direction",exampleSpanish:"La estación de metro está aquí mismo, a la izquierda.",exampleEnglish:"The subway station is right here, to the left.",level:"beginner",category:"Travel & Directions"},{id:"v-b12",spanish:"¿Cuánto cuesta?",english:"How much does it cost?",phonetic:"KWAN-toh KWEHS-tah",partOfSpeech:"Question",exampleSpanish:"Me gusta esta bufanda. ¿Cuánto cuesta?",exampleEnglish:"I like this scarf. How much does it cost?",level:"beginner",category:"Travel & Directions"},{id:"v-b13",spanish:"El boleto / El billete",english:"Ticket (transit / flight / museum)",phonetic:"ehl boh-LEH-toh / ehl bee-YEH-teh",partOfSpeech:"Noun (m)",genderTip:'Latin America mostly uses "boleto"; Spain uses "billete" (or "entrada" for events).',exampleSpanish:"Necesito dos boletos para el tren de las diez.",exampleEnglish:"I need two tickets for the 10:00 train.",level:"beginner",category:"Travel & Directions"},{id:"v-b14",spanish:"Tengo hambre / Tengo sed",english:"I am hungry / I am thirsty",phonetic:"TEHN-goh AHM-breh / TEHN-goh sehd",partOfSpeech:"Expression",genderTip:'Careful! Spanish says "I HAVE hunger / thirst" ("Tengo..."), not "Estoy"!',exampleSpanish:"Caminamos mucho y ahora tengo mucha sed.",exampleEnglish:"We walked a lot and now I am very thirsty.",level:"beginner",category:"People & Feelings"},{id:"v-b15",spanish:"Feliz / Cansado(a)",english:"Happy / Tired",phonetic:"feh-LEES / kahn-SAH-doh (kahn-SAH-dah)",partOfSpeech:"Adjective",genderTip:'"Feliz" stays the same for everyone; "cansado" ends in -o (masc) or -a (fem).',exampleSpanish:"Estoy un poco cansada, pero muy feliz de estar aquí.",exampleEnglish:"I am a little tired, but very happy to be here.",level:"beginner",category:"People & Feelings"},{id:"v-b16",spanish:"Hoy / Mañana / Ayer",english:"Today / Tomorrow / Yesterday",phonetic:"oy / mah-NYAH-nah / ah-YEHR",partOfSpeech:"Time Words",genderTip:'Fun note: "mañana" means "tomorrow", while "la mañana" means "the morning"!',exampleSpanish:"Hoy descanso, pero mañana visito el museo.",exampleEnglish:"Today I rest, and tomorrow I visit the museum.",level:"beginner",category:"Daily Life & Work"},{id:"v-i1",spanish:"¿Qué me recomiendas?",english:"What do you recommend to me?",phonetic:"keh meh reh-koh-MYEHN-dahs",partOfSpeech:"Phrase",exampleSpanish:"Es mi primera vez aquí, ¿qué plato me recomiendas?",exampleEnglish:"It’s my first time here, what dish do you recommend?",level:"intermediate",category:"Food & Café"},{id:"v-i2",spanish:"Soy alérgico(a) a...",english:"I am allergic to...",phonetic:"soy ah-LEHR-hee-koh ah",partOfSpeech:"Phrase",genderTip:'Permanent trait, so use SER ("Soy"). E.g., "los mariscos" (shellfish), "las nueces" (nuts).',exampleSpanish:"Disculpa, soy alérgica al maní. ¿Esta salsa lleva nueces?",exampleEnglish:"Excuse me, I’m allergic to peanuts. Does this sauce have nuts?",level:"intermediate",category:"Food & Café"},{id:"v-i3",spanish:"Seguir todo recto / derecho",english:"To continue straight ahead",phonetic:"seh-GEER TOH-doh REHK-toh / deh-REH-choh",partOfSpeech:"Direction Phrase",exampleSpanish:"Sigue todo recto tres cuadras hasta ver la catedral.",exampleEnglish:"Keep straight three blocks until you see the cathedral.",level:"intermediate",category:"Travel & Directions"},{id:"v-i4",spanish:"La reserva / La habitación",english:"The reservation / The hotel room",phonetic:"lah reh-SEHR-vah / lah ah-bee-tah-SYOHN",partOfSpeech:"Noun (f)",exampleSpanish:"Hola, tengo una reserva a nombre de Taylor por tres noches.",exampleEnglish:"Hi, I have a reservation under the name Taylor for three nights.",level:"intermediate",category:"Travel & Directions"},{id:"v-i5",spanish:"Perder el vuelo / el tren",english:"To miss the flight / the train",phonetic:"pehr-DEHR ehl VWEH-loh / ehl trehn",partOfSpeech:"Verb Phrase",genderTip:'English says "miss" the bus/train; Spanish uses "perder" (to lose)!',exampleSpanish:"Salimos temprano para no perder el tren.",exampleEnglish:"We left early so we wouldn’t miss the train.",level:"intermediate",category:"Travel & Directions"},{id:"v-i6",spanish:"Echar de menos / Extrañar",english:"To miss someone or a place",phonetic:"eh-CHAR deh MEH-nohs / ehks-trah-NYAR",partOfSpeech:"Verb",genderTip:'"Extrañar" is universal in Latin America; "echar de menos" is super common in Spain.',exampleSpanish:"Extraño mucho el café de mi barrio.",exampleEnglish:"I really miss the coffee from my neighborhood.",level:"intermediate",category:"People & Feelings"},{id:"v-i7",spanish:"Emocionado(a) vs. Avergonzado(a)",english:"Excited vs. Embarrassed",phonetic:"eh-moh-syoh-NAH-doh / ah-vehr-gohn-SAH-doh",partOfSpeech:"Adjectives",genderTip:'FALSE FRIEND ALERT! Never say "embarazada" for embarrassed—that means pregnant!',exampleSpanish:"Estoy súper emocionado por mi viaje a Oaxaca.",exampleEnglish:"I am super excited about my trip to Oaxaca.",level:"intermediate",category:"People & Feelings"},{id:"v-i8",spanish:"Llevarse bien con alguien",english:"To get along well with someone",phonetic:"yeh-VAR-seh byehn kohn AHL-gyehn",partOfSpeech:"Reflexive Phrase",exampleSpanish:"Me llevo muy bien con mis compañeros de piso.",exampleEnglish:"I get along really well with my roommates.",level:"intermediate",category:"People & Feelings"},{id:"v-i9",spanish:"Quedar / Ponerse de acuerdo",english:"To meet up / To agree on a plan",phonetic:"keh-DAR / poh-NEHR-seh deh ah-KWEHR-doh",partOfSpeech:"Verb Phrase",exampleSpanish:"¿A qué hora nos ponemos de acuerdo para cenar el viernes?",exampleEnglish:"What time shall we agree on to have dinner Friday?",level:"intermediate",category:"Daily Life & Work"},{id:"v-i10",spanish:"Teletrabajar / Trabajar desde casa",english:"To work remotely / work from home",phonetic:"teh-leh-trah-bah-HAR / trah-bah-HAR DEHS-deh KAH-sah",partOfSpeech:"Verb Phrase",exampleSpanish:"Los martes y jueves trabajo desde casa.",exampleEnglish:"On Tuesdays and Thursdays I work from home.",level:"intermediate",category:"Daily Life & Work"},{id:"v-i11",spanish:"Darse cuenta (de que...)",english:"To realize (that...)",phonetic:"DAR-seh KWEHN-tah deh keh",partOfSpeech:"Idiomatic Verb",genderTip:'"Realizar" means to carry out/accomplish—use "darse cuenta" for "realize"!',exampleSpanish:"Acabo de darme cuenta de que dejé mis llaves adentro.",exampleEnglish:"I just realized I left my keys inside.",level:"intermediate",category:"Idioms & Connectors"},{id:"v-i12",spanish:"Acabar de + infinitivo",english:"To have just done something",phonetic:"ah-kah-BAR deh",partOfSpeech:"Time Shortcut",genderTip:'Super easy past shortcut: "Acabo de llegar" = "I just arrived!"',exampleSpanish:"Acabamos de pedir unas tapas, ¡siéntate con nosotros!",exampleEnglish:"We just ordered some tapas—sit down with us!",level:"intermediate",category:"Idioms & Connectors"},{id:"v-c1",spanish:"Ponerse las pilas",english:"To focus, step up your game, get energized",phonetic:"poh-NEHR-seh lahs PEE-lahs",partOfSpeech:"Idiom",genderTip:'Literally "to put in one’s batteries"—used daily in school, sports, and work.',exampleSpanish:"Si queremos entregar el diseño mañana, toca ponernos las pilas.",exampleEnglish:"If we want to hand in the design tomorrow, it’s time to lock in and focus.",level:"challenging",category:"Idioms & Connectors"},{id:"v-c2",spanish:"Valer la pena",english:"To be worth it / worth the effort",phonetic:"vah-LEHR lah PEH-nah",partOfSpeech:"Idiom",exampleSpanish:"La caminata fue agotadora, pero la vista valió totalmente la pena.",exampleEnglish:"The hike was exhausting, but the view was totally worth it.",level:"challenging",category:"Idioms & Connectors"},{id:"v-c3",spanish:"Sin embargo / No obstante",english:"However / Nevertheless",phonetic:"seen ehm-BAR-goh / noh ohbs-TAHN-teh",partOfSpeech:"Connector",exampleSpanish:"El piso es pequeño; sin embargo, tiene muchísima luz natural.",exampleEnglish:"The apartment is small; however, it gets tons of natural light.",level:"challenging",category:"Idioms & Connectors"},{id:"v-c4",spanish:"A pesar de (que)...",english:"Despite / Even though...",phonetic:"ah peh-SAR deh keh",partOfSpeech:"Connector",exampleSpanish:"Salimos a correr a pesar de que estaba lloviendo.",exampleEnglish:"We went out for a run even though it was raining.",level:"challenging",category:"Idioms & Connectors"},{id:"v-c5",spanish:"Estar al tanto",english:"To be aware / kept in the loop",phonetic:"ehs-TAR ahl TAHN-toh",partOfSpeech:"Idiom",exampleSpanish:"Avísame cualquier cambio para estar al tanto.",exampleEnglish:"Let me know about any change so I stay in the loop.",level:"challenging",category:"Daily Life & Work"},{id:"v-c6",spanish:"Llegar a un acuerdo",english:"To reach an agreement / compromise",phonetic:"yeh-GAR ah oon ah-KWEHR-doh",partOfSpeech:"Negotiation Phrase",exampleSpanish:"Seguro que podemos llegar a un acuerdo que nos beneficie a ambos.",exampleEnglish:"I’m sure we can reach an agreement that benefits us both.",level:"challenging",category:"Daily Life & Work"},{id:"v-c7",spanish:"El presupuesto / Los gastos incluidos",english:"Budget / Utilities included",phonetic:"ehl preh-soo-PWEHS-toh / lohs GAHS-tohs een-kloo-EE-dohs",partOfSpeech:"Noun Phrase",exampleSpanish:"¿El alquiler tiene los gastos de luz y agua incluidos?",exampleEnglish:"Does the rent have electricity and water utilities included?",level:"challenging",category:"Daily Life & Work"},{id:"v-c8",spanish:"Reembolsar / Cambiar por otro",english:"To refund / To exchange for another one",phonetic:"reh-ehm-bohl-SAR / kahm-BYAR por OH-troh",partOfSpeech:"Verbs",exampleSpanish:"El cargador dejó de funcionar ayer; ¿podrían cambiarlo por otro?",exampleEnglish:"The charger stopped working yesterday; could you exchange it for another one?",level:"challenging",category:"Travel & Directions"},{id:"v-c9",spanish:"Agobiado(a) / Abrumado(a)",english:"Overwhelmed / Stressed out",phonetic:"ah-goh-BYAH-doh / ah-broo-MAH-doh",partOfSpeech:"Adjective",exampleSpanish:"Estaba un poco agobiada al principio, pero ya le agarré el ritmo.",exampleEnglish:"I was a bit overwhelmed at first, but I already got the hang of it.",level:"challenging",category:"People & Feelings"},{id:"v-c10",spanish:"Echar una mano",english:"To lend a hand / help out",phonetic:"eh-CHAR OO-nah MAH-noh",partOfSpeech:"Idiom",exampleSpanish:"¿Te echo una mano preparando la cena?",exampleEnglish:"Shall I lend you a hand making dinner?",level:"challenging",category:"Greetings & Survival"},{id:"v-c11",spanish:"Sobremesa",english:"Unhurried conversation lingering at the table after eating",phonetic:"soh-breh-MEH-sah",partOfSpeech:"Cultural Noun (f)",genderTip:"Untranslatable single word! A cherished tradition across Spain and Latin America.",exampleSpanish:"Lo mejor del domingo familiar fue la sobremesa de dos horas.",exampleEnglish:"The best part of family Sunday was the two-hour chat around the table after lunch.",level:"challenging",category:"Food & Café"},{id:"v-c12",spanish:"Ni hablar / En absoluto",english:"Out of the question / Not at all",phonetic:"nee ah-BLAR / ehn ahb-soh-LOO-toh",partOfSpeech:"Emphatic Reply",exampleSpanish:"¿Te molesta si abro la ventana? — ¡En absoluto, adelante!",exampleEnglish:"Do you mind if I open the window? — Not at all, go right ahead!",level:"challenging",category:"Greetings & Survival"}],Qc=[{id:"rp-beg-cafe",title:"Morning Café Order in Madrid",setting:"Sunlit Neighborhood Café",location:"Madrid, Spain",level:"beginner",partnerId:"sofia",partnerRoleInScenario:"Friendly Café Barista",englishSituationBrief:"You just sat down at a cozy café terrace in Madrid. Greet Sofía, politely order a drink + something to eat, say whether it’s for here or to go, and ask for the check at the end!",culturalTip:'In Spain, ordering with "¿Me pones un...?" or "Quisiera un..." with a smile is super natural, and tipping is optional small change rather than mandatory 20%!',keySurvivalPhrases:[{spanish:"Quisiera un café con leche, por favor.",english:"I would like a coffee with milk, please.",phonetic:"kee-SYEH-rah oon kah-FEH kohn LEH-cheh, por fah-VOR"},{spanish:"Para tomar aquí, por favor.",english:"For here, please.",phonetic:"PAH-rah toh-MAR ah-KEE, por fah-VOR"},{spanish:"¿Me traes la cuenta, por favor?",english:"Could you bring me the check, please?",phonetic:"meh TRAH-ehs lah KWEHN-tah, por fah-VOR"}],objectives:[{id:"obj-1",labelEnglish:"Greet the barista & order a drink politely",hintSpanish:"¡Buenos días! Quisiera un café con leche, por favor.",hintPhonetic:"BWEH-nohs DEE-ahs! kee-SYEH-rah oon kah-FEH kohn LEH-cheh, por fah-VOR",keywords:["hola","buenos","buenas","quisiera","café","cafe","té","te","agua","jugo","pones","quiero"]},{id:"obj-2",labelEnglish:'Order food & clarify "for here" or "to go"',hintSpanish:"Un croissant también, para tomar aquí.",hintPhonetic:"oon krwah-SAHN tahm-BYEHN, PAH-rah toh-MAR ah-KEE",keywords:["aquí","aqui","llevar","pan","tostada","croissant","pastel","taco","también","tambien","nada más"]},{id:"obj-3",labelEnglish:"Thank them & ask for the check / pay by card",hintSpanish:"Muchas gracias. ¿La cuenta, por favor? Pago con tarjeta.",hintPhonetic:"MOO-chahs GRAH-syahs. lah KWEHN-tah, por fah-VOR? PAH-goh kohn tar-HEH-tah",keywords:["cuenta","tarjeta","pagar","pago","efectivo","cuánto","cuanto"]}],steps:[{partnerSpanish:"¡Hola, buenos días! Bienvenido al Café del Sol. ¿Qué te pongo hoy para empezar el día?",partnerEnglish:"Hi, good morning! Welcome to Café del Sol. What can I get you today to start your day?",partnerPhonetic:"OH-lah, BWEH-nohs DEE-ahs! keh teh POHN-goh oy PAH-rah ehm-peh-SAR ehl DEE-ah?",coachNoteEnglish:'Tip: "¿Qué te pongo?" is how baristas warmly ask "What can I get for you?"',suggestedReplies:[{spanish:"¡Buenos días! Quisiera un café con leche, por favor.",english:"Good morning! I would like a coffee with milk, please.",phonetic:"BWEH-nohs DEE-ahs! kee-SYEH-rah oon kah-FEH kohn LEH-cheh, por fah-VOR."},{spanish:"¡Hola! ¿Me pones un té verde y un vaso de agua, por favor?",english:"Hi! Could you get me a green tea and a glass of water, please?",phonetic:"OH-lah! meh POH-nehs oon teh VEHR-deh ee oon VAH-soh deh AH-gwah?"}]},{partnerSpanish:"¡Claro que sí, enseguida! ¿Quieres algo para comer, como una tostada o un croissant? ¿Y es para tomar aquí o para llevar?",partnerEnglish:"Of course, right away! Would you like something to eat, like toast or a croissant? And is it for here or to go?",partnerPhonetic:"KLAH-roh keh see, ehn-seh-GEE-dah! KYEH-rehs AHL-goh PAH-rah koh-MEHR? PAH-rah ah-KEE oh PAH-rah yeh-VAR?",coachNoteEnglish:'Try answering BOTH questions: pick a snack + say "para tomar aquí" or "para llevar"!',suggestedReplies:[{spanish:"Sí, un croissant, por favor. Es para tomar aquí.",english:"Yes, a croissant, please. It is for here.",phonetic:"see, oon krwah-SAHN, por fah-VOR. ehs PAH-rah toh-MAR ah-KEE."},{spanish:"Una tostada con tomate, por favor, para llevar.",english:"A tomato toast, please, to go.",phonetic:"OO-nah tohs-TAH-dah kohn toh-MAH-teh, por fah-VOR, PAH-rah yeh-VAR."}]},{partnerSpanish:"¡Aquí tienes, que aproveche! ... (Unos minutos después) ¿Estuvo todo rico? ¿Te traigo algo más?",partnerEnglish:"Here you go, enjoy! ... (A few minutes later) Was everything tasty? Can I bring you anything else?",partnerPhonetic:"ah-KEE TYEH-nehs, keh ah-proh-VEH-cheh! ehs-TOO-voh TOH-doh RREE-koh?",coachNoteEnglish:'"¡Que aproveche!" = "Enjoy your meal!" Now compliment the food and ask for "la cuenta"!',suggestedReplies:[{spanish:"¡Muy rico, muchas gracias! Nada más. ¿Me traes la cuenta, por favor? Pago con tarjeta.",english:"Delicious, thank you! Nothing else. Could you bring the check? I’m paying by card.",phonetic:"mwee RREE-koh! NAH-dah mahs. meh TRAH-ehs lah KWEHN-tah, por fah-VOR?"},{spanish:"Todo delicioso, gracias. La cuenta, por favor.",english:"Everything delicious, thanks. The check, please.",phonetic:"TOH-doh deh-lee-SYOH-soh, GRAH-syahs. lah KWEHN-tah, por fah-VOR."}]},{partnerSpanish:"¡Perfecto! Son cuatro euros con cincuenta. Aquí tienes el lector para tu tarjeta. ¡Muchas gracias y que tengas un día precioso!",partnerEnglish:"Perfect! That is 4.50 euros. Here is the card reader. Thank you so much and have a wonderful day!",partnerPhonetic:"pehr-FEHK-toh! sohn KWAH-troh EH-oo-rohs kohn seen-KWEHN-tah. keh TEHN-gahs oon DEE-ah preh-SYOH-soh!",coachNoteEnglish:"You just handled a full Madrid café visit in Spanish from start to finish!",suggestedReplies:[{spanish:"¡Muchas gracias a ti! ¡Hasta luego!",english:"Thank you so much! See you later!",phonetic:"MOO-chahs GRAH-syahs ah tee! AHS-tah LWEH-goh!"}]}]},{id:"rp-beg-metro",title:"Asking Directions to the Metro",setting:"Busy Historic Plaza",location:"Mexico City, Mexico",level:"beginner",partnerId:"mateo",partnerRoleInScenario:"Helpful Local Passerby",englishSituationBrief:"Your phone battery died while sightseeing in Mexico City! Politely stop Mateo, ask where the nearest subway station is, confirm how far it is, and thank him warmly.",culturalTip:'Starting with "Disculpa, buenos días" before asking a question on the street in Mexico is considered polite and always brings warm help.',keySurvivalPhrases:[{spanish:"Disculpa, ¿dónde está la estación de metro?",english:"Excuse me, where is the subway station?",phonetic:"dees-KOOL-pah, DOHN-deh ehs-TAH lah ehs-tah-SYOHN deh MEH-troh?"},{spanish:"¿Está cerca o lejos caminando?",english:"Is it close or far walking?",phonetic:"ehs-TAH SEHR-kah oh LEH-hohs kah-mee-NAHN-doh?"}],objectives:[{id:"m-obj-1",labelEnglish:"Politely get attention & ask where the metro is",hintSpanish:"Disculpa, ¿dónde está la estación de metro?",hintPhonetic:"dees-KOOL-pah, DOHN-deh ehs-TAH lah ehs-tah-SYOHN deh MEH-troh?",keywords:["disculpa","perdón","perdon","dónde","donde","metro","estación","estacion"]},{id:"m-obj-2",labelEnglish:"Ask if it is close by on foot / confirm direction",hintSpanish:"¿Está cerca caminando? ¿A la derecha?",hintPhonetic:"ehs-TAH SEHR-kah kah-mee-NAHN-doh? ah lah deh-REH-chah?",keywords:["cerca","lejos","caminando","derecha","izquierda","minutos","cuadras"]},{id:"m-obj-3",labelEnglish:"Thank him politely before heading off",hintSpanish:"¡Muchas gracias por tu ayuda! Buen día.",hintPhonetic:"MOO-chahs GRAH-syahs por too ah-YOO-dah! bwehn DEE-ah.",keywords:["gracias","amable","buen día","buen dia","hasta luego"]}],steps:[{partnerSpanish:"¡Hola! Sí, dime, ¿en qué te puedo ayudar?",partnerEnglish:"Hi! Sure, tell me, how can I help you?",partnerPhonetic:"OH-lah! see, DEE-meh, ehn keh teh PWEH-doh ah-yoo-DAR?",coachNoteEnglish:'Ask Mateo where the metro station ("la estación de metro") is located!',suggestedReplies:[{spanish:"Disculpa, ¿dónde está la estación de metro más cercana?",english:"Excuse me, where is the nearest subway station?",phonetic:"dees-KOOL-pah, DOHN-deh ehs-TAH lah ehs-tah-SYOHN deh MEH-troh mahs sehr-KAH-nah?"},{spanish:"Perdón, estoy un poco perdido. ¿Dónde está el metro?",english:"Sorry, I’m a bit lost. Where is the subway?",phonetic:"pehr-DOHN, ehs-TOY oon POH-koh pehr-DEE-doh. DOHN-deh ehs-TAH ehl MEH-troh?"}]},{partnerSpanish:"¡Ah, es muy fácil! Sigue derecho por esta calle y gira a la derecha en la farmacia.",partnerEnglish:"Ah, super easy! Go straight down this street and turn right at the pharmacy.",partnerPhonetic:"ah, ehs mwee FAH-seel! SEE-geh deh-REH-choh por EHS-tah KAH-yeh ee HEE-rah ah lah deh-REH-chah...",coachNoteEnglish:'Check if it’s close walking ("¿Está cerca caminando?") and confirm "a la derecha"!',suggestedReplies:[{spanish:"Perfecto, a la derecha en la farmacia. ¿Está cerca caminando?",english:"Perfect, to the right at the pharmacy. Is it close walking?",phonetic:"pehr-FEHK-toh, ah lah deh-REH-chah. ehs-TAH SEHR-kah kah-mee-NAHN-doh?"}]},{partnerSpanish:"Sí, está súper cerca, a solo cinco minutos a pie. ¡Verás el cartel naranja enseguida!",partnerEnglish:"Yes, super close, only five minutes on foot. You’ll spot the orange sign right away!",partnerPhonetic:"see, ehs-TAH SOO-pehr SEHR-kah, ah SOH-loh SEEN-koh mee-NOO-tohs ah pyeh!",coachNoteEnglish:'Wrap up warmly by thanking him ("¡Muchas gracias por tu ayuda!").',suggestedReplies:[{spanish:"¡Muchas gracias por tu ayuda! Eres muy amable. ¡Buen día!",english:"Thank you very much for your help! You’re very kind. Have a good day!",phonetic:"MOO-chahs GRAH-syahs por too ah-YOO-dah! EH-rehs mwee ah-MAH-bleh."}]}]},{id:"rp-beg-host",title:"Arriving at Your Host Family’s Home",setting:"Warm Apartment Living Room",location:"Valencia, Spain",level:"beginner",partnerId:"sofia",partnerRoleInScenario:"Welcoming Host Sister",englishSituationBrief:"You just arrived with your suitcase at your homestay! Introduce yourself, share where you are from, and ask a polite household question (like Wi-Fi or breakfast time).",culturalTip:'Spanish hosts love offering water or coffee the moment you step through the door—accepting even a glass of water ("Sí, un vaso de agua, por favor") breaks the ice warmly!',keySurvivalPhrases:[{spanish:"Mucho gusto, gracias por recibirme.",english:"Nice to meet you, thank you for welcoming me.",phonetic:"MOO-choh GOOS-toh, GRAH-syahs por reh-see-BEER-meh"},{spanish:"¿Cuál es la clave del wifi, por favor?",english:"What is the Wi-Fi password, please?",phonetic:"kwahl ehs lah KLAH-veh dehl WEE-fee, por fah-VOR"}],objectives:[{id:"h-obj-1",labelEnglish:"Greet your host warmly & introduce yourself",hintSpanish:"¡Hola! Mucho gusto, gracias por recibirme. Soy de Estados Unidos.",hintPhonetic:"OH-lah! MOO-choh GOOS-toh, GRAH-syahs por reh-see-BEER-meh.",keywords:["hola","gusto","llamo","soy","gracias","recibir"]},{id:"h-obj-2",labelEnglish:"Accept or decline a drink politely after your trip",hintSpanish:"Sí, un vaso de agua, por favor. El viaje fue largo.",hintPhonetic:"see, oon VAH-soh deh AH-gwah, por fah-VOR.",keywords:["agua","café","cafe","té","por favor","viaje","sed"]},{id:"h-obj-3",labelEnglish:"Ask a helpful question about Wi-Fi or breakfast time",hintSpanish:"Una pregunta: ¿cuál es la contraseña del wifi?",hintPhonetic:"OO-nah preh-GOON-tah: kwahl ehs lah kohn-trah-SEH-nyah dehl WEE-fee?",keywords:["wifi","wi-fi","clave","contraseña","desayuno","hora"]}],steps:[{partnerSpanish:"¡Adelante, bienvenido a casa! Qué ilusión tenerte aquí. ¿Cómo estuvo tu viaje?",partnerEnglish:"Come on in, welcome home! How exciting having you here. How was your trip?",partnerPhonetic:"ah-deh-LAHN-teh, byehn-veh-NEE-doh ah KAH-sah! KOH-moh ehs-TOO-voh too VYAH-heh?",coachNoteEnglish:'"¡Adelante!" means "Come right in!" Greet Sofía and share how your trip was.',suggestedReplies:[{spanish:"¡Hola! Mucho gusto y gracias por recibirme. Soy de Estados Unidos y el viaje estuvo muy bien.",english:"Hi! Nice to meet you and thanks for having me. I’m from the US and the trip went really well.",phonetic:"OH-lah! MOO-choh GOOS-toh ee GRAH-syahs por reh-see-BEER-meh..."}]},{partnerSpanish:"¡Me alegro mucho! Deja tu maleta aquí. ¿Quieres un vaso de agua fría o un café?",partnerEnglish:"So glad to hear! Leave your suitcase here. Would you like a glass of cold water or a coffee?",partnerPhonetic:"meh ah-LEH-groh MOO-choh! KYEH-rehs oon VAH-soh deh AH-gwah FREE-ah oh oon kah-FEH?",coachNoteEnglish:'Accept a drink politely using "por favor"!',suggestedReplies:[{spanish:"Sí, un vaso de agua fría, por favor. Tengo un poco de sed.",english:"Yes, a glass of cold water, please. I am a little thirsty.",phonetic:"see, oon VAH-soh deh AH-gwah FREE-ah, por fah-VOR."}]},{partnerSpanish:"¡Claro! Aquí tienes. Siéntete como en tu casa. ¿Necesitas saber algo ahora mismo?",partnerEnglish:"Of course! Here you go. Make yourself at home. Do you need to know anything right now?",partnerPhonetic:"KLAH-roh! SYEHN-teh-teh KOH-moh ehn too KAH-sah.",coachNoteEnglish:"Ask
